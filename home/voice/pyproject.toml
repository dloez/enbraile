[project]
name = "enbraile-voice"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "av==16.1.0",
  "chatterbox-tts==0.1.7",
  "ctranslate2==4.9.0",
  "faster-whisper==1.2.1",
  "numpy==2.5.4",
  "piper-tts==1.8.0",
  "six==1.17.0",
  "soundfile==0.14.0",
  "torch==2.11.0",
  "torchcodec==0.17.0",
  "torchaudio==2.11.0",
  "websockets==17.4",
  "hyperpyyaml==1.2.3",
  "openai-whisper==20250625",
  "x-transformers==2.11.24",
  "modelscope==1.31.0",
  "inflect==7.6.0",
  "hydra-core==1.3.8",
  "lightning==2.6.6",
  "gdown==6.5.1",
  "matplotlib==3.11.2",
  "wget==3.2",
  "pyarrow==26.0.1",
  "pyworld==0.3.5",
  "num2words==0.5.14",
]

[tool.uv]
package = false
override-dependencies = ["torch==2.11.0", "torchaudio==2.11.0"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchcodec = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
