<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dloez</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5ad1f0}a:hover{color:#9be4f7}
.tab:not([aria-current]):hover{background:#222a3b!important;color:#ffffff!important}.out:hover{color:#ffffff!important;background:#222a3b!important}
.me:hover{background:#222a3b!important}
.lrow:hover{background:#283146!important}
.banner{transition:transform 0.12s steps(2),box-shadow 0.12s steps(2)}
.banner:hover,.banner:focus-visible{transform:translateY(-4px);border-color:#5ad1f0!important;box-shadow:0 8px 0 0 #0a0d14}
@media (prefers-reduced-motion: reduce){.banner{transition:none}.banner:hover{transform:none}}
</style>
</helmet>
<div style="width: 1440px; min-height: 1100px; box-sizing: border-box; display: flex; flex-direction: column; font-family: 'Nunito', system-ui, sans-serif; font-synthesis: none; font-size: 16px; line-height: 1.45; color: #eef1f7; background-color: #161b26; background-image: radial-gradient(#232b3c 1.5px, transparent 1.5px); background-size: 20px 20px">

<header style="flex: none; height: 64px; display: flex; align-items: center; gap: 28px; padding: 0 32px; background: #10141d; border-bottom: 4px solid #d93a30; box-sizing: border-box">
<a href="Main.dc.html" aria-label="Home" style="flex: none; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 8px">
<svg width="36" height="36" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 0h4v1H4zM2 1h2v1H2zM8 1h2v1H8zM1 2h1v1H1zM10 2h1v1H10zM1 3h1v1H1zM10 3h1v1H10zM0 4h1v1H0zM5 4h2v1H5zM11 4h1v1H11zM0 5h5v1H0zM7 5h5v1H7zM0 6h1v1H0zM4 6h1v1H4zM7 6h1v1H7zM11 6h1v1H11zM0 7h1v1H0zM5 7h2v1H5zM11 7h1v1H11zM1 8h1v1H1zM10 8h1v1H10zM1 9h1v1H1zM10 9h1v1H10zM2 10h2v1H2zM8 10h2v1H8zM4 11h4v1H4z" fill="#4a5470"></path><path d="M4 1h4v1H4zM2 2h1v1H2zM4 2h6v1H4zM2 3h8v1H2zM1 4h4v1H1zM7 4h4v1H7z" fill="#e3403a"></path><path d="M3 2h1v1H3zM5 5h2v1H5zM1 6h3v1H1zM5 6h2v1H5zM8 6h3v1H8zM1 7h4v1H1zM7 7h4v1H7zM2 8h8v1H2zM2 9h8v1H2zM4 10h4v1H4z" fill="#ffffff"></path></svg>
</a>
<nav aria-label="Sections" style="align-self: stretch; display: flex; align-items: flex-end; gap: 4px">
<a href="SeriesList.dc.html" class="tab" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 20px; border-radius: 10px 10px 0 0; background: transparent; color: #c3cad8; font-family: 'Jersey 10', sans-serif; font-size: 26px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 0h1v10H1zM2 1h6v1H2zM2 2h7v1H2zM2 3h6v1H2zM2 4h5v1H2z" fill="currentColor"></path></svg>Series</a>
<a href="Pc.dc.html" class="tab" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 20px; border-radius: 10px 10px 0 0; background: transparent; color: #c3cad8; font-family: 'Jersey 10', sans-serif; font-size: 26px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 1h10v1H0zM0 2h1v4H0zM9 2h1v4H9zM0 6h10v1H0zM2 3h1v1H2zM4 7h2v1H4zM2 8h6v1H2z" fill="currentColor"></path></svg>PC</a>
<a href="TeamsList.dc.html" class="tab" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 20px; border-radius: 10px 10px 0 0; background: transparent; color: #c3cad8; font-family: 'Jersey 10', sans-serif; font-size: 26px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><path d="M2 1h2v2H2zM6 1h2v2H6zM1 4h4v4H1zM5 4h4v4H5z" fill="currentColor"></path></svg>Teams<span title="1 team to build" style="min-width: 24px; height: 24px; padding: 0 6px; box-sizing: border-box; border-radius: 12px; border: 3px solid #10141d; background: #ffd34d; color: #10141d; font-size: 18px; line-height: 18px; text-align: center">1</span></a>
</nav>
<div style="flex: 1"></div>
<div style="display: flex; align-items: center; gap: 12px">
<a href="Profile.dc.html" class="me" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 8px; border-radius: 8px; background: #222a3b; text-decoration: none">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 8px; border: 3px solid #10141d; box-shadow: 0 0 0 2px #ffd34d; background: #ffd34d; box-sizing: border-box; display: grid; place-items: center; font-family: 'Jersey 10', sans-serif; font-size: 24px; color: #10141d">D</span>
<span style="font-family: 'Jersey 10', sans-serif; font-size: 24px; color: #ffffff">Dloez</span>
</a>
<button type="button" class="out" aria-label="Sign out" title="Sign out" style="width: 44px; height: 44px; border: none; border-radius: 8px; background: transparent; color: #a3acbf; display: grid; place-items: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4"></path><path d="M10 8l-4 4 4 4M6 12h10"></path></svg></button>
</div>
</header>

<main style="flex: 1; display: flex; flex-direction: column; gap: 32px; padding: 36px 40px 48px">

<div style="display: flex; align-items: center; gap: 22px">
<span aria-hidden="true" style="width: 84px; height: 84px; flex: none; box-sizing: border-box; border-radius: 14px; border: 4px solid #10141d; box-shadow: 0 0 0 4px #ffd34d; background: #ffd34d; display: grid; place-items: center; font-family: 'Jersey 10', sans-serif; font-size: 56px; color: #10141d">D</span>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 14px">
<h1 style="margin: 0; font-family: 'Jersey 10', sans-serif; font-weight: 400; font-size: 84px; line-height: 0.8">Dloez</h1>
<span style="font-family: 'Jersey 10', sans-serif; font-size: 20px; color: #10141d; background: #ffd34d; padding: 1px 8px; border-radius: 4px">You</span>
</div>
<span style="font-family: 'Jersey 10', sans-serif; font-size: 24px; color: #a3acbf">Trainer since Series 1</span>
</div>
</div>

<section aria-labelledby="totals" style="display: flex; flex-direction: column; gap: 14px">
<h2 id="totals" style="margin: 0; font-family: 'Jersey 10', sans-serif; font-weight: 400; font-size: 38px">Career</h2>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{totals}}" as="t" hint-placeholder-count="7">
<div style="min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: #222a3b; border: 3px solid #343f58; border-radius: 14px">
<span style="font-family: 'Jersey 10', sans-serif; font-size: 20px; color: #a3acbf">{{t.label}}</span>
<span style="font-family: 'Jersey 10', sans-serif; font-size: 38px; line-height: 0.9; color: {{t.ink}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums">{{t.value}}</span>
<span style="min-height: 20px; font-size: 14px; font-weight: 700; color: #a3acbf">{{t.sub}}</span>
</div>
</sc-for>
</div>
<div role="table" aria-label="League" style="background: #222a3b; border: 3px solid #343f58; border-radius: 18px; overflow: hidden">
<div role="row" style="display: grid; grid-template-columns: minmax(0, 1fr) 120px 120px 120px 200px 180px 40px; align-items: center; min-height: 48px; padding: 0 20px; background: #1b2232; border-bottom: 3px solid #343f58; font-family: 'Jersey 10', sans-serif; font-size: 20px; color: #a3acbf">
<span role="columnheader">League</span><span role="columnheader" style="text-align: center">Place</span><span role="columnheader" style="text-align: center">Points</span><span role="columnheader" style="text-align: center">W–L</span><span role="columnheader" style="text-align: center">Pokémon League</span><span role="columnheader" style="text-align: center">Cup</span><span></span>
</div>
<sc-for list="{{leagues}}" as="l" hint-placeholder-count="2">
<a href="League.dc.html" role="row" class="lrow" style="display: grid; grid-template-columns: minmax(0, 1fr) 120px 120px 120px 200px 180px 40px; align-items: center; min-height: 68px; padding: 0 20px; border-bottom: {{l.line}}; color: #eef1f7; text-decoration: none">
<span role="cell" style="display: flex; align-items: center; gap: 12px"><span style="font-family: 'Jersey 10', sans-serif; font-size: 30px">{{l.name}}</span><span style="font-family: 'Jersey 10', sans-serif; font-size: 18px; padding: 1px 8px; border-radius: 5px; background: {{l.stateBg}}; color: {{l.stateInk}}">{{l.state}}</span></span>
<span role="cell" style="text-align: center; font-family: 'Jersey 10', sans-serif; font-size: 32px; color: {{l.placeInk}}">{{l.place}}</span>
<span role="cell" style="text-align: center; font-family: 'Jersey 10', sans-serif; font-size: 32px">{{l.pts}}</span>
<span role="cell" style="text-align: center; font-family: 'Jersey 10', sans-serif; font-size: 26px; color: #c3cad8">{{l.wl}}</span>
<span role="cell" style="display: flex; justify-content: center"><sc-if value="{{l.hasPips}}" hint-placeholder-val="{{ true }}"><span style="display: flex; gap: 4px"><sc-for list="{{l.pips}}" as="q" hint-placeholder-count="5"><span aria-hidden="true" style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 5px; border: 3px solid {{q.line}}; background: {{q.bg}}"></span></sc-for></span></sc-if><sc-if value="{{l.noPips}}" hint-placeholder-val="{{ false }}"><span style="font-family: 'Jersey 10', sans-serif; font-size: 24px; color: #6b7489">—</span></sc-if></span>
<span role="cell" style="text-align: center; font-family: 'Jersey 10', sans-serif; font-size: 26px; color: {{l.cupInk}}">{{l.cup}}</span>
<svg width="14" height="20" viewBox="0 0 14 18" aria-hidden="true" style="justify-self: end"><path d="M2 2l10 7-10 7z" fill="#5ad1f0"></path></svg>
</a>
</sc-for>
</div>
</section>

<section aria-labelledby="series" style="display: flex; flex-direction: column; gap: 14px">
<h2 id="series" style="margin: 0; font-family: 'Jersey 10', sans-serif; font-weight: 400; font-size: 38px">Series</h2>
<sc-for list="{{series}}" as="s" hint-placeholder-count="2">
<a href="TrainerJourney.dc.html" class="banner" style="position: relative; display: block; height: 168px; overflow: hidden; border-radius: 18px; border: 4px solid #2c3549; color: #ffffff; text-decoration: none">
<span aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column">
<sc-for list="{{s.bands}}" as="b" hint-placeholder-count="5"><span style="flex: {{b.f}}; background: {{b.c}}"></span></sc-for>
</span>
<span style="position: relative; height: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 28px; padding: 0 32px">
<span style="flex: 1; display: flex; flex-direction: column; gap: 10px">
<span style="display: flex; align-items: center; gap: 14px">
<span style="font-family: 'Jersey 10', sans-serif; font-size: 72px; line-height: 0.8; text-shadow: 0 5px 0 {{s.shadow}}">{{s.name}}</span>
<span style="font-family: 'Jersey 10', sans-serif; font-size: 20px; padding: 1px 10px; border-radius: 5px; background: {{s.stateBg}}; color: {{s.stateInk}}">{{s.state}}</span>
</span>
<span style="font-weight: 800; font-size: 17px; color: #ffffff; text-shadow: 0 2px 0 {{s.shadow}}">{{s.game}}</span>
</span>
<span style="display: flex; gap: 10px">
<sc-for list="{{s.stats}}" as="x" hint-placeholder-count="4">
<span style="flex: none; width: 136px; display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; box-sizing: border-box; background: rgba(10,16,38,0.82); border: 3px solid #34406a; border-radius: 12px">
<span style="font-family: 'Jersey 10', sans-serif; font-size: 18px; color: #b9c8ec">{{x.label}}</span>
<span style="font-family: 'Jersey 10', sans-serif; font-size: 32px; line-height: 0.95; color: {{x.ink}}; white-space: nowrap">{{x.value}}</span>
</span>
</sc-for>
</span>
<svg width="14" height="20" viewBox="0 0 14 18" aria-hidden="true"><path d="M2 2l10 7-10 7z" fill="#5ad1f0"></path></svg>
</span>
</a>
</sc-for>
</section>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
const NIGHT = [{f: 3, c: '#0d1430'}, {f: 2, c: '#111a3b'}, {f: 2, c: '#162147'}, {f: 1.4, c: '#1c2954'}, {f: 1.6, c: '#0a1026'}];
const DAY = [{f: 3, c: '#3d7fd1'}, {f: 2, c: '#5a98e0'}, {f: 1.4, c: '#86b8ee'}, {f: 1.2, c: '#3f8f3a'}, {f: 1.4, c: '#2d6b2b'}];
class Component extends DCLogic {
  renderVals() {
    const lgPips = (n) => Array.from({length: 5}, (_, i) => ({bg: i < n ? (i === 4 ? '#ffd34d' : '#5ad1f0') : '#10141d', line: i < n ? '#10141d' : '#44506d'}));
    const leagues = [
      {name: 'Series 2', state: 'Round 5', stateBg: '#d93a30', stateInk: '#ffffff', place: '1st', placeInk: '#ffd34d', pts: 3, wl: '3–1', hasPips: false, noPips: true, pips: [], tries: 'Pokémon League', cup: '—', cupInk: '#6b7489'},
      {name: 'Series 1', state: 'Finished', stateBg: '#10141d', stateInk: '#c3cad8', place: '1st', placeInk: '#ffd34d', pts: 9, wl: '4–1', hasPips: true, noPips: false, pips: lgPips(5), tries: 'Pokémon League', cup: 'Semifinal', cupInk: '#eef1f7'}
    ];
    return {
      leagues: leagues.map((l, i) => Object.assign(l, {line: i < leagues.length - 1 ? '3px solid #343f58' : 'none'})),
      totals: [
        {label: 'Series', value: '2', sub: '1 finished', ink: '#eef1f7'},
        {label: 'Play time', value: '61 h 40', sub: '', ink: '#eef1f7'},
        {label: 'Badges', value: '15', sub: 'of 16', ink: '#eef1f7'},
        {label: 'Best Pokédex', value: '118', sub: 'owned · Series 1', ink: '#eef1f7'},
        {label: 'Trainer battles', value: '402 – 3', sub: 'won – lost', ink: '#eef1f7'},
        {label: 'Blackouts', value: '3', sub: '', ink: '#eef1f7'},
        {label: 'Fallen', value: '9', sub: '', ink: '#ff6a5e'}
      ],
      series: [
        {name: 'Series 2', game: 'Pokémon Añil · Randomlocke', state: 'Playing now', stateBg: '#d93a30', stateInk: '#ffffff', shadow: '#0a1a4a', bands: NIGHT,
          stats: [{label: 'Reached', value: 'Gym 7', ink: '#ffffff'}, {label: 'Play time', value: '27 h 14', ink: '#ffffff'}, {label: 'Fallen', value: '3', ink: '#ff8a80'}, {label: 'Teams', value: '5', ink: '#ffffff'}]},
        {name: 'Series 1', game: 'Pokémon Añil · Randomlocke', state: 'Finished', stateBg: '#10141d', stateInk: '#c3cad8', shadow: '#1e4f8f', bands: DAY,
          stats: [{label: 'Reached', value: 'League', ink: '#ffd34d'}, {label: 'Play time', value: '34 h 26', ink: '#ffffff'}, {label: 'Fallen', value: '6', ink: '#ff8a80'}, {label: 'Teams', value: '3', ink: '#ffffff'}]}
      ]
    };
  }
}
</script>
</body>
</html>
