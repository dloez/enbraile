<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin sign-in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5ad1f0}a:hover{color:#9be4f7}
.go:not(:disabled):hover,.go:focus-visible{background:#ef5148!important}
.field:focus{border-color:#5ad1f0!important;box-shadow:0 0 0 3px rgba(90,209,240,0.3)}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: 'Nunito', system-ui, sans-serif; font-synthesis: none; color: #eef1f7; background-color: #161b26; background-image: radial-gradient(#232b3c 1.5px, transparent 1.5px); background-size: 20px 20px">

<div style="flex: none; height: 330px; background: #10141d; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 24px 50px; box-sizing: border-box">
<span style="display: flex; align-items: center; gap: 14px; font-family: 'Jersey 10', sans-serif; font-size: 30px; color: #ffd34d">
<svg width="30" height="30" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 2h3v1H1zM0 3h1v3H0zM4 3h1v3H4zM1 6h3v1H1zM5 4h5v1H5zM7 5h1v2H7zM9 5h1v2H9z" fill="currentColor"></path></svg>
Admin</span>
<h1 style="margin: 0; font-weight: 400; font-family: 'Jersey 10', sans-serif; font-size: 120px; line-height: 0.8; color: #ffffff">pkmn</h1>
</div>

<div style="flex: none; height: 18px; background: #d93a30"></div>

<div aria-hidden="true" style="position: absolute; left: 670px; top: 289px; width: 100px; height: 100px; border-radius: 50%; background: #eef1f7; border: 12px solid #10141d; box-sizing: border-box; display: grid; place-items: center">
<span style="width: 36px; height: 36px; border-radius: 50%; border: 5px solid #10141d; box-sizing: border-box"></span>
</div>

<div style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 84px 40px 40px">
<form onSubmit="{{submit}}" style="width: 440px; display: flex; flex-direction: column; gap: 18px; padding: 28px 28px 30px; box-sizing: border-box; background: #222a3b; border: 3px solid #343f58; border-radius: 18px">
<label style="display: flex; flex-direction: column; gap: 6px; font-family: 'Jersey 10', sans-serif; font-size: 24px; color: #c3cad8">Username
<input class="field" name="username" autocomplete="username" value="admin" style="height: 50px; padding: 0 14px; box-sizing: border-box; border-radius: 10px; border: 3px solid #343f58; background: #10141d; color: #eef1f7; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 18px; outline: none">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-family: 'Jersey 10', sans-serif; font-size: 24px; color: #c3cad8">Password
<input class="field" name="password" type="password" autocomplete="current-password" value="{{password}}" style="height: 50px; padding: 0 14px; box-sizing: border-box; border-radius: 10px; border: 3px solid {{pwLine}}; background: #10141d; color: #eef1f7; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 18px; outline: none">
</label>
<sc-if value="{{error}}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: -4px 0 0; font-weight: 700; font-size: 15px; color: #ff6a5e">Wrong username or password</p>
</sc-if>
<button type="submit" class="go" style="min-height: 56px; margin-top: 4px; border: none; border-radius: 10px; background: #d93a30; color: #ffffff; box-shadow: inset 0 -4px 0 0 rgba(0,0,0,0.3); font-family: 'Jersey 10', sans-serif; font-size: 30px; cursor: pointer">Sign in</button>
</form>
<a href="SignIn.dc.html" style="margin-top: 22px; font-weight: 700; font-size: 15px; text-decoration: none">Not an admin? Players sign in with Discord</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"error":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const error = this.state && this.state.error !== undefined ? this.state.error : !!this.props.error;
    return {
      error, password: error ? '' : 'hunter22', pwLine: error ? '#ff6a5e' : '#343f58',
      submit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({error: !error}); }
    };
  }
}
</script>
</body>
</html>
