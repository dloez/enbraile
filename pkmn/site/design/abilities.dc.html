    const trainer = this.st('trainer', '');
    const holds = (p) => !ab || (p.abilities || []).some((a) => a.id === ab) && (!inUse || (p.ability && p.ability.id === ab));
    const shown = all.filter((p) => (!ql || (p.nickname || '').toLowerCase().includes(ql) || p.name.toLowerCase().includes(ql)) && (!type || (p.sdTypes || p.types).includes(type)) && holds(p) && (!trainer || p.owner.name === trainer));
    const sel = this.st('sel', shown[0] ? shown[0].key : null);
    const picked = all.find((p) => p.key === sel) || shown[0] || all[0];
    const cells = shown.map((p) => ({
      sprite: SPRITES[p.key], lvl: String(p.level), shiny: !!p.shiny, on: p.key === sel,
      bg: p.key === sel ? 'rgba(90, 209, 240, 0.22)' : 'rgba(16, 20, 29, 0.35)', ring: p.key === sel ? 'inset 0 0 0 3px #5ad1f0' : 'none',
      colour: p.owner.colour, initial: p.owner.initial,
      aria: (p.nickname || p.name) + ', ' + p.name + ', level ' + p.level + ', ' + p.owner.name + '\'s',
      pick: () => this.setState({sel: p.key}),
    }));
    return {
      phone, wide: !phone,
      rootW: phone ? '390px' : '1440px', rootH: phone ? '844px' : '1000px', fixedH: phone ? 'auto' : '1000px',
      mainPad: phone ? '20px 16px 24px' : '20px 40px 32px', h1Size: phone ? '48px' : '60px',
      seriesHref: phone ? 'MainPhone.dc.html' : 'Main.dc.html',
      boxMinH: phone ? '640px' : '0', searchFlex: phone ? '1 1 100%' : 'none', searchW: phone ? 'auto' : '220px',
      cols: phone ? 'repeat(4, minmax(0, 1fr))' : 'repeat(auto-fill, minmax(106px, 1fr))', spriteW: phone ? '92%' : '96px',
      count: (shown.length === all.length ? '' : shown.length + ' of ') + all.length + ' Pokémon',
      query: this.st('q', ''), onQuery: (e) => this.setState({q: e.target.value}),
      typeOptions: TYPE, type, onType: (e) => this.setState({type: e.target.value}),
      abilityOptions: options.map((a) => ({id: a.id, label: a.name + ' · ' + a.n})), ability: ab, onAbility: (e) => this.setState({ab: e.target.value}),
      hasAbility: ab !== '', inUse, toggleInUse: () => this.setState({inUse: !inUse}),
      inUseBg: inUse ? '#5ad1f0' : 'rgba(255,255,255,0.1)', inUseFg: inUse ? '#10141d' : '#ffffff',
      trainerOptions: TRAINERS, trainer, onTrainer: (e) => this.setState({trainer: e.target.value}),
      cells, none: !!d && shown.length === 0,
      sumMon: picked ? {key: picked.key} : null,
      owner: picked ? {colour: picked.owner.colour, initial: picked.owner.initial, label: picked.owner.name + '\'s PC · ' + picked.owner.milestone} : {colour: '#44506d', initial: '', label: ''},
    };
  }
}
</script>
