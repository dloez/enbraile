    const shown = q ? all.filter((a) => a.name.toLowerCase().includes(q)) : all;
    const listed = shown.map((a) => ({
      name: a.name, count: a.count, current: a.id === picked ? 'true' : undefined,
      bg: a.id === picked ? '#2c3549' : 'transparent', ink: a.id === picked ? '#ffffff' : '#c3cad8',
      pick: () => this.setState({ab: a.id, view: 'holders'}),
    }));
    const only = this.st('show', 'all');
    const held = (m) => (m.abilities || []).find((a) => a.id === picked);
    const inUse = (m) => !!m.ability && m.ability.id === picked;
    const card = (m) => {
      const h = held(m);
      const name = m.nickname || m.name;
      return {
        name, sub: (m.nickname ? m.name + ' · ' : '') + 'Lv ' + m.level, sprite: SPRITES[m.key],
        current: inUse(m), hidden: !!(h && h.hidden),
        aria: name + ', level ' + m.level + (inUse(m) ? ', in use' : ''),
      };
    };
    const rank = (m) => (inUse(m) ? 0 : 1);
    const groupsAll = owned.map((t) => ({t, list: t.mons.filter(held).sort((a, b) => rank(a) - rank(b) || b.level - a.level)})).filter((g) => g.list.length > 0);
    const total = groupsAll.reduce((n, g) => n + g.list.length, 0);
    const used = groupsAll.reduce((n, g) => n + g.list.filter(inUse).length, 0);
    const groups = groupsAll
      .map((g) => ({...g, list: only === 'all' ? g.list : g.list.filter(inUse)}))
      .filter((g) => g.list.length > 0)
      .map((g) => ({name: g.t.name, initial: g.t.initial, colour: g.t.colour, you: !!g.t.you, milestone: g.t.milestone, count: g.list.length, mons: g.list.map(card)}));
    const seg = (value, label) => ({
      label, on: only === value, bg: only === value ? '#d93a30' : 'transparent', fg: only === value ? '#ffffff' : '#c3cad8',
      pick: () => this.setState({show: value}),
    });
    const entry = entries[picked] || {name: '', desc: ''};
    return {
      phone, wide: !phone,
      rootW: phone ? '390px' : '1440px', rootH: phone ? '844px' : '1000px', fixedH: phone ? (view === 'list' ? '844px' : 'auto') : '1000px',
      mainPad: phone ? '20px 16px 24px' : '20px 32px 24px', h1Size: phone ? '48px' : '60px',
      seriesHref: phone ? 'MainPhone.dc.html' : 'Main.dc.html',
      showList: !phone || view === 'list', showHolders: !phone || view === 'holders',
      listFlex: phone ? '1' : 'none', listW: phone ? 'auto' : '380px', holdersPad: phone ? '14px' : '20px',
      gridCols: phone ? 'minmax(0, 1fr)' : 'repeat(auto-fill, minmax(240px, 1fr))',
      listCount: q ? shown.length + ' of ' + all.length + ' abilities' : all.length + ' abilities',
      query, onQuery: (e) => this.setState({query: e.target.value}), listed,
      toList: () => this.setState({view: 'list'}),
      ab: {name: entry.name, desc: entry.desc || '—'},
      shows: [seg('all', 'Can have · ' + total), seg('current', 'In use · ' + used)],
      groups, nobody: groups.length === 0 && !!d,
    };
  }
}
</script>
