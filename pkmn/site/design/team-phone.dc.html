<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#161b26}
a{color:#5ad1f0}a:hover{color:#9be4f7}
.ph-menu:hover{background:#222a3b!important;color:#ffffff!important}
.ph-item:not([aria-current]):hover{background:#222a3b!important;color:#ffffff!important}
.btn:not(:disabled):hover{background:rgba(255,255,255,0.18)!important}
.seg:not([aria-checked="true"]):not([aria-selected="true"]):not(:disabled):hover{background:#2c3549!important;color:#ffffff!important}
.mvb:not(:disabled):hover{border-color:#5ad1f0!important}
.who:hover{border-color:#5ad1f0!important}
.x:not(:disabled):hover{border-color:#5ad1f0!important;color:#ffffff!important}
.addc:hover{border-color:#5ad1f0!important;color:#ffffff!important}
.row:not(:disabled):hover{border-color:#5ad1f0!important}
.cell:hover{box-shadow:inset 0 0 0 3px #5ad1f0!important}
.ico{background-image:url(/_blob/60638f84e12716d49b223430466fcd7f);background-repeat:no-repeat;image-rendering:pixelated}
.field:focus-within{border-color:#5ad1f0!important}
select option{background:#10141d;color:#eef1f7}
.sheetbody>*{flex-shrink:0}
</style>
</helmet>
<div style="position: relative; width: 390px; min-height: 844px; box-sizing: border-box; display: flex; flex-direction: column; font-family: 'Nunito', system-ui, sans-serif; font-synthesis: none; font-size: 16px; line-height: 1.45; color: #eef1f7; background-color: #161b26; background-image: radial-gradient(#232b3c 1.5px, transparent 1.5px); background-size: 20px 20px">

<header style="position: relative; z-index: 2; flex: none; height: 60px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; background: #10141d; border-bottom: 4px solid #d93a30; box-sizing: border-box">
<a href="MainPhone.dc.html" aria-label="Home" style="flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 8px">
<svg width="32" height="32" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 0h4v1H4zM2 1h2v1H2zM8 1h2v1H8zM1 2h1v1H1zM10 2h1v1H10zM1 3h1v1H1zM10 3h1v1H10zM0 4h1v1H0zM5 4h2v1H5zM11 4h1v1H11zM0 5h5v1H0zM7 5h5v1H7zM0 6h1v1H0zM4 6h1v1H4zM7 6h1v1H7zM11 6h1v1H11zM0 7h1v1H0zM5 7h2v1H5zM11 7h1v1H11zM1 8h1v1H1zM10 8h1v1H10zM1 9h1v1H1zM10 9h1v1H10zM2 10h2v1H2zM8 10h2v1H8zM4 11h4v1H4z" fill="#4a5470"></path><path d="M4 1h4v1H4zM2 2h1v1H2zM4 2h6v1H4zM2 3h8v1H2zM1 4h4v1H1zM7 4h4v1H7z" fill="#e3403a"></path><path d="M3 2h1v1H3zM5 5h2v1H5zM1 6h3v1H1zM5 6h2v1H5zM8 6h3v1H8zM1 7h4v1H1zM7 7h4v1H7zM2 8h8v1H2zM2 9h8v1H2zM4 10h4v1H4z" fill="#ffffff"></path></svg>
</a>
<span style="flex: 1; display: flex; align-items: center; gap: 8px; font-family: 'Jersey 10', sans-serif; font-size: 26px; color: #ffffff"><svg width="16" height="16" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><path d="M2 1h2v2H2zM6 1h2v2H6zM1 4h4v4H1zM5 4h4v4H5z" fill="#d93a30"></path></svg>Teams</span>
<button type="button" class="ph-menu" aria-label="Menu" aria-expanded="{{open}}" aria-controls="ph-panel" onClick="{{toggle}}" style="flex: none; width: 44px; height: 44px; border: none; border-radius: 8px; background: {{btnBg}}; color: #ffffff; display: grid; place-items: center; cursor: pointer">
<sc-if value="{{closed}}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 1h8v2H1zM1 4h8v2H1zM1 7h8v2H1z" fill="currentColor"></path></svg></sc-if>
<sc-if value="{{open}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 1h2v1H1zM7 1h2v1H7zM2 2h2v1H2zM6 2h2v1H6zM3 3h2v1H3zM5 3h2v1H5zM4 4h2v2H4zM3 6h2v1H3zM5 6h2v1H5zM2 7h2v1H2zM6 7h2v1H6zM1 8h2v1H1zM7 8h2v1H7z" fill="currentColor"></path></svg></sc-if>
</button>
</header>

<sc-if value="{{pageOn}}" hint-placeholder-val="{{ true }}">
<main style="padding: 16px 16px 32px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<a href="TeamsListPhone.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 8px; min-height: 32px; font-family: 'Jersey 10', sans-serif; font-size: 22px; text-decoration: none"><svg width="8" height="12" viewBox="0 0 14 18" aria-hidden="true"><path d="M12 2L2 9l10 7z" fill="currentColor"></path></svg>Teams</a>
<h1 style="margin: 0; font-family: 'Jersey 10', sans-serif; font-weight: 400; font-size: 44px; line-height: 0.9">{{title}}</h1>
<sc-if value="{{ro}}" hint-placeholder-val="{{ false }}">
<span style="align-self: flex-start; font-family: 'Jersey 10', sans-serif; font-size: 20px; color: #10141d; background: {{ownerC}}; padding: 1px 8px; border-radius: 4px">{{owner}}'s team</span>
</sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{chips}}" as="sc" hint-placeholder-count="2">
<span style="display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 10px 0 6px; box-sizing: border-box; border-radius: 8px; border: 3px {{sc.line}} {{sc.border}}; background: #10141d; font-family: 'Jersey 10', sans-serif; font-size: 19px">
<sc-if value="{{sc.isPc}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 5px; background: {{sc.c}}; color: #10141d; display: grid; place-items: center; font-size: 16px">{{sc.i}}</span></sc-if>
{{sc.label}}
<sc-if value="{{sc.isPc}}" hint-placeholder-val="{{ true }}"><span title="Mini Setas left" style="display: flex; align-items: center; gap: 3px; color: {{sc.setaInk}}"><svg width="14" height="14" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 1h4v1H4zM2 2h8v1H2zM1 3h10v3H1z" fill="#e3403a"></path><path d="M3 3h2v2H3zM8 2h1v2H8zM6 4h1v1H6z" fill="#ffffff"></path><path d="M4 6h4v4H4zM3 10h6v1H3z" fill="#f2ead6"></path></svg>{{sc.seta}}<span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Mini Setas left</span></span></sc-if>
</span>
</sc-for>
<sc-if value="{{rw}}" hint-placeholder-val="{{ true }}">
<button type="button" class="btn" style="display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 12px; border: none; border-radius: 8px; background: rgba(255,255,255,0.1); color: #c3cad8; font-family: 'Jersey 10', sans-serif; font-size: 19px; cursor: pointer"><span style="color: #5ad1f0; display: flex"><svg width="11" height="11" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 0h2v10H4zM0 4h10v2H0z" fill="currentColor"></path></svg></span>Source</button>
</sc-if>
</div>
<sc-if value="{{rw}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<div role="radiogroup" aria-label="Members" style="display: flex; gap: 4px; padding: 4px; background: #10141d; border: 3px solid #343f58; border-radius: 12px; align-items: center">
<span aria-hidden="true" style="flex: 1; padding-left: 8px; font-family: 'Jersey 10', sans-serif; font-size: 20px; color: #a3acbf">Members</span>
<sc-for list="{{sizes}}" as="z" hint-placeholder-count="3">
<button type="button" class="seg" role="radio" aria-checked="{{z.on}}" aria-label="{{z.n}} members" disabled="{{z.off}}" onClick="{{z.pick}}" style="width: 52px; min-height: 40px; border: none; border-radius: 8px; font-family: 'Jersey 10', sans-serif; font-size: 22px; cursor: pointer; background: {{z.bg}}; color: {{z.fg}}; opacity: {{z.fade}}; cursor: {{z.cursor}}">{{z.n}}</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: 1fr 2fr; gap: 8px">
<button type="button" class="btn" style="min-height: 44px; padding: 0 14px 4px; box-sizing: border-box; border: none; border-radius: 8px; background: rgba(255,255,255,0.1); color: #ffffff; box-shadow: inset 0 -4px 0 0 rgba(0,0,0,0.35); font-family: 'Jersey 10', sans-serif; font-size: 22px; cursor: pointer">Paste</button>
<button type="button" class="btn" style="min-height: 44px; padding: 0 14px 4px; box-sizing: border-box; border: none; border-radius: 8px; background: rgba(255,255,255,0.1); color: #ffffff; box-shadow: inset 0 -4px 0 0 rgba(0,0,0,0.35); font-family: 'Jersey 10', sans-serif; font-size: 22px; cursor: pointer">Copy for Showdown</button>
</div>
</div>
</sc-if>
<sc-if value="{{ro}}" hint-placeholder-val="{{ false }}">
<button type="button" class="btn" style="min-height: 44px; padding: 0 14px 4px; box-sizing: border-box; border: none; border-radius: 8px; background: rgba(255,255,255,0.1); color: #ffffff; box-shadow: inset 0 -4px 0 0 rgba(0,0,0,0.35); font-family: 'Jersey 10', sans-serif; font-size: 22px; cursor: pointer">Copy for Showdown</button>
</sc-if>

<div role="tablist" aria-label="Team view" style="display: flex; gap: 4px; padding: 4px; background: #10141d; border: 3px solid #343f58; border-radius: 12px">
<sc-for list="{{tabsView}}" as="tv" hint-placeholder-count="2">
<button type="button" class="seg" role="tab" aria-selected="{{tv.on}}" onClick="{{tv.pick}}" style="flex: 1; min-height: 40px; border: none; border-radius: 8px; font-family: 'Jersey 10', sans-serif; font-size: 22px; cursor: pointer; background: {{tv.bg}}; color: {{tv.fg}}">{{tv.name}}</button>
</sc-for>
</div>

<sc-if value="{{onMembers}}" hint-placeholder-val="{{ true }}">
<ol aria-label="Members" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{cards}}" as="cd" hint-placeholder-count="6">
<li style="display: flex">
<sc-if value="{{cd.filled}}" hint-placeholder-val="{{ true }}">
<article aria-label="{{cd.name}}" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 6px 8px 8px 6px; box-sizing: border-box; border-radius: 14px; background: #222a3b; border: 3px solid {{cd.border}}; opacity: {{cd.dim}}">
<div style="display: flex; align-items: center; gap: 6px">
<button type="button" class="who" onClick="{{cd.look}}" aria-label="Summary of {{cd.name}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; min-height: 60px; padding: 0 8px 0 0; box-sizing: border-box; border: 3px solid #2c3549; border-radius: 10px; background: #1b2232; color: #eef1f7; font: inherit; text-align: left; cursor: pointer">
<span style="flex: none; width: 60px; height: 56px; display: flex; align-items: center; justify-content: center; overflow: hidden"><img src="{{cd.sprite}}" alt="" width="72" height="72" style="flex: none; display: block; margin: -12px -6px -8px; image-rendering: pixelated"></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-family: 'Jersey 10', sans-serif; font-size: 24px; line-height: 0.9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{cd.name}}</span>
<span style="font-family: 'Jersey 10', sans-serif; font-size: 16px; color: #a3acbf">{{cd.sub}}</span>
<span style="display: flex; flex-wrap: wrap; gap: 4px">
<sc-for list="{{cd.types}}" as="t" hint-placeholder-count="2"><span style="font-family: 'Jersey 10', sans-serif; font-size: 15px; line-height: 19px; color: #ffffff; background: {{t.c}}; border-radius: 5px; padding: 0 6px; text-shadow: 0 1px 0 rgba(0,0,0,0.45)">{{t.name}}</span></sc-for>
<span style="font-family: 'Jersey 10', sans-serif; font-size: 15px; line-height: 15px; padding: 0 5px; border-radius: 4px; color: {{cd.tagInk}}; background: {{cd.tagBg}}; border: 2px {{cd.tagLine}} {{cd.tagBorder}}">{{cd.tag}}</span>
</span>
</span>
<svg width="9" height="15" viewBox="0 0 3 5" shape-rendering="crispEdges" aria-hidden="true" style="flex: none; color: #a3acbf"><path d="M0 0h1v1h1v1h1v1H2v1H1v1H0z" fill="currentColor"></path></svg>
</button>
<sc-if value="{{cd.pickable}}" hint-placeholder-val="{{ false }}">
<button type="button" class="x" aria-pressed="{{cd.inSix}}" disabled="{{cd.pickOff}}" onClick="{{cd.togglePick}}" title="{{cd.pickTitle}}" style="flex: none; min-width: 44px; height: 44px; padding: 0 8px; box-sizing: border-box; border-radius: 10px; border: 3px solid {{cd.pickBorder}}; background: {{cd.pickBg}}; color: {{cd.pickInk}}; font-family: 'Jersey 10', sans-serif; font-size: 19px; cursor: {{cd.pickCursor}}">{{cd.pickLabel}}</button>
</sc-if>
<sc-if value="{{cd.canSet}}" hint-placeholder-val="{{ false }}">
<button type="button" class="x" onClick="{{cd.setPick}}" title="Level, nature, EVs and IVs" style="flex: none; height: 44px; padding: 0 8px; box-sizing: border-box; border-radius: 10px; border: 3px solid #44506d; background: #2c3549; color: #c3cad8; font-family: 'Jersey 10', sans-serif; font-size: 19px; cursor: pointer">Set</button>
</sc-if>
<sc-if value="{{cd.rw}}" hint-placeholder-val="{{ true }}">
<button type="button" class="x" aria-label="Take {{cd.name}} out" title="Take out of the team" onClick="{{cd.remove}}" style="flex: none; width: 44px; height: 44px; box-sizing: border-box; border-radius: 10px; border: 3px solid #44506d; background: #2c3549; color: #c3cad8; display: grid; place-items: center; cursor: pointer"><svg width="11" height="11" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 0h2v1h1v1h2V1h1V0h2v2H7v1H6v2h1v1h1v2H6V7H5V6H3v1H2v1H0V6h1V5h1V3H1V2H0z" fill="currentColor"></path></svg></button>
</sc-if>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
<button type="button" class="mvb" disabled="{{cd.ro}}" onClick="{{cd.itPick}}" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px 0 4px; box-sizing: border-box; background: #1b2232; border: 3px solid #2c3549; border-radius: 10px; min-width: 0; color: #eef1f7; font: inherit; text-align: left; cursor: {{cd.cursor}}">
<sc-if value="{{cd.hasItem}}" hint-placeholder-val="{{ true }}"><span class="ico" style="flex: none; display: block; width: 24px; height: 24px; background-position: {{cd.itemPos}}"></span></sc-if>
<sc-if value="{{cd.noItem}}" hint-placeholder-val="{{ false }}"><span style="flex: none; padding-left: 4px; font-family: 'Jersey 10', sans-serif; font-size: 17px; color: #a3acbf">Item</span></sc-if>
<span style="flex: 1; min-width: 0; font-weight: 800; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: {{cd.itemInk}}">{{cd.itemName}}</span>
</button>
<button type="button" class="mvb" disabled="{{cd.ro}}" onClick="{{cd.abPick}}" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px; box-sizing: border-box; background: #1b2232; border: 3px solid #2c3549; border-radius: 10px; min-width: 0; color: #eef1f7; font: inherit; text-align: left; cursor: {{cd.cursor}}">
<span style="flex: 1; min-width: 0; font-weight: 800; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{cd.abName}}</span>
<sc-if value="{{cd.seta}}" hint-placeholder-val="{{ false }}"><span title="Costs 1 Mini Seta" style="flex: none; display: grid; place-items: center"><svg width="14" height="14" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 1h4v1H4zM2 2h8v1H2zM1 3h10v3H1z" fill="#e3403a"></path><path d="M3 3h2v2H3zM8 2h1v2H8zM6 4h1v1H6z" fill="#ffffff"></path><path d="M4 6h4v4H4zM3 10h6v1H3z" fill="#f2ead6"></path></svg></span></sc-if>
</button>
<sc-for list="{{cd.moves}}" as="mv" hint-placeholder-count="4">
<button type="button" class="mvb" disabled="{{cd.ro}}" onClick="{{mv.pick}}" style="display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; align-items: center; column-gap: 7px; min-height: 44px; padding: 0 8px 0 5px; box-sizing: border-box; border-radius: 10px; background: #1b2232; border: 3px solid #2c3549; color: #eef1f7; font: inherit; text-align: left; cursor: {{cd.cursor}}">
<span aria-hidden="true" style="height: 26px; border-radius: 3px; background: {{mv.c}}"></span>
<span style="display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 800; font-size: 13px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{mv.name}}</span><span style="font-size: 11px; font-weight: 700; color: #a3acbf">{{mv.type}}</span></span>
<span style="font-family: 'Jersey 10', sans-serif; font-size: 19px; color: #c3cad8">{{mv.power}}</span>
</button>
</sc-for>
</div>
</article>
</sc-if>
<sc-if value="{{cd.empty}}" hint-placeholder-val="{{ false }}">
<sc-if value="{{cd.rw}}" hint-placeholder-val="{{ true }}">
<button type="button" class="addc" onClick="{{cd.add}}" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 72px; border-radius: 14px; border: 3px dashed #44506d; background: transparent; color: #a3acbf; font-family: 'Jersey 10', sans-serif; font-size: 24px; cursor: pointer"><svg width="11" height="11" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 0h2v10H4zM0 4h10v2H0z" fill="currentColor"></path></svg>Add a Pokémon</button>
</sc-if>
<sc-if value="{{cd.ro}}" hint-placeholder-val="{{ false }}">
<span style="flex: 1; display: grid; place-items: center; min-height: 72px; border-radius: 14px; border: 3px dashed #343f58; font-family: 'Jersey 10', sans-serif; font-size: 22px; color: #6b7489">Empty</span>
</sc-if>
</sc-if>
</li>
</sc-for>
</ol>
</sc-if>

<sc-if value="{{onAnalysis}}" hint-placeholder-val="{{ false }}">
<sc-if value="{{scopeOn}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 10px">
<div role="radiogroup" aria-label="Analyse" style="display: flex; gap: 4px; padding: 4px; background: #10141d; border: 3px solid #343f58; border-radius: 12px">
<sc-for list="{{scopes}}" as="sv" hint-placeholder-count="2">
<button type="button" class="seg" role="radio" aria-checked="{{sv.on}}" onClick="{{sv.pick}}" style="padding: 0 12px; min-height: 40px; border: none; border-radius: 8px; font-family: 'Jersey 10', sans-serif; font-size: 22px; cursor: pointer; background: {{sv.bg}}; color: {{sv.fg}}">{{sv.name}}</button>
</sc-for>
</div>
<span role="status" style="font-family: 'Jersey 10', sans-serif; font-size: 20px; color: {{scopeInk}}">{{scopeNote}}</span>
</div>
</sc-if>
<section aria-label="Analysis" style="height: 760px; display: flex; flex-direction: column; padding: 12px; box-sizing: border-box; background: #222a3b; border: 3px solid #343f58; border-radius: 18px; overflow: hidden">
<dc-import name="TeamAnalysis" mode="panel" members="{{anaMembers}}" team-name="{{title}}" style="flex: 1; min-height: 0; display: flex; flex-direction: column" hint-size="100%,100%"></dc-import>
</section>
</sc-if>
</main>
</sc-if>

<sc-if value="{{sheetOn}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; top: 0; height: {{sheetH}}; min-height: 844px; z-index: 5; display: flex; flex-direction: column; background-color: #161b26">
<div style="flex: none; height: 60px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #10141d; border-bottom: 4px solid #d93a30">
<button type="button" class="x" aria-label="Back" onClick="{{closeSheet}}" style="flex: none; width: 44px; height: 44px; box-sizing: border-box; border-radius: 10px; border: 3px solid #44506d; background: #2c3549; color: #c3cad8; display: grid; place-items: center; cursor: pointer"><svg width="8" height="12" viewBox="0 0 14 18" aria-hidden="true"><path d="M12 2L2 9l10 7z" fill="currentColor"></path></svg></button>
<h2 id="sheet-title" style="flex: 1; min-width: 0; margin: 0; font-family: 'Jersey 10', sans-serif; font-weight: 400; font-size: 24px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="color: #a3acbf">{{sheetWho}}</span>{{sheetWhat}}</h2>
</div>
<div class="sheetbody" style="flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px">

<sc-if value="{{onSum}}" hint-placeholder-val="{{ false }}">
<div style="flex: none; align-self: center; width: 380px; height: 868px; margin: -14px -11px 0; display: flex"><dc-import name="Summary" mon="{{sumMon}}" style="flex: 1; display: flex; flex-direction: column" hint-size="380px,868px"></dc-import></div>
</sc-if>

<sc-if value="{{onItem}}" hint-placeholder-val="{{ false }}">
<div role="tablist" aria-label="Pockets" style="display: flex; gap: 4px; padding: 4px; background: #10141d; border: 3px solid #343f58; border-radius: 12px">
