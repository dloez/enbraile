<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dloez's PC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5ad1f0}a:hover{color:#9be4f7}
.tab:not([aria-current]):hover{background:#222a3b!important;color:#ffffff!important}.out:hover{color:#ffffff!important;background:#222a3b!important}
.btn:hover{background:rgba(255,255,255,0.18)!important}
.me:hover{background:#222a3b!important}
.seg:not([aria-checked="true"]):not([aria-selected="true"]):not(:disabled):hover{background:#2c3549!important;color:#ffffff!important}
.abil:hover{background:rgba(255,255,255,0.06)!important}
.cell:hover{box-shadow:inset 0 0 0 3px #5ad1f0!important}
.row:hover{border-color:#5ad1f0!important}
.x:hover{border-color:#5ad1f0!important;color:#ffffff!important}
.ico{background-image:url(/_blob/60638f84e12716d49b223430466fcd7f);background-repeat:no-repeat;image-rendering:pixelated}
.ico2{background-size:768px auto}
.ico3{background-size:1152px auto}
.field:focus-within{border-color:#5ad1f0!important}
select option{background:#10141d;color:#eef1f7}
.pcscroll{scrollbar-width:none}
.pcscroll::-webkit-scrollbar{display:none}
@keyframes nudge-down{0%{transform:translateY(0)}100%{transform:translateY(4px)}}
@keyframes nudge-up{0%{transform:translateY(0)}100%{transform:translateY(-4px)}}
.more:hover{border-color:#5ad1f0!important}
.go:hover{background:#ef5148!important}
.mi:not(:disabled):hover{background:#2c3549!important}
.mvscroll{scrollbar-width:thin;scrollbar-color:#44506d transparent}
.mvrow:not([aria-pressed="true"]):hover{background:rgba(255,255,255,0.06)!important}
@media (prefers-reduced-motion: reduce){.more svg{animation:none!important}}
</style>
</helmet>
<sc-if value="{{inPc}}" hint-placeholder-val="{{ true }}">
<div style="position: relative; width: {{rootW}}; height: {{rootH}}; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; font-family: 'Nunito', system-ui, sans-serif; font-synthesis: none; font-size: 16px; line-height: 1.45; color: #eef1f7; background-color: #161b26; background-image: radial-gradient(#232b3c 1.5px, transparent 1.5px); background-size: 20px 20px">

<sc-if value="{{chrome}}" hint-placeholder-val="{{ true }}">
<header style="flex: none; height: 64px; display: flex; align-items: center; gap: 28px; padding: 0 32px; background: #10141d; border-bottom: 4px solid #d93a30; box-sizing: border-box">
<a href="Main.dc.html" aria-label="Home" style="flex: none; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 8px">
<svg width="36" height="36" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 0h4v1H4zM2 1h2v1H2zM8 1h2v1H8zM1 2h1v1H1zM10 2h1v1H10zM1 3h1v1H1zM10 3h1v1H10zM0 4h1v1H0zM5 4h2v1H5zM11 4h1v1H11zM0 5h5v1H0zM7 5h5v1H7zM0 6h1v1H0zM4 6h1v1H4zM7 6h1v1H7zM11 6h1v1H11zM0 7h1v1H0zM5 7h2v1H5zM11 7h1v1H11zM1 8h1v1H1zM10 8h1v1H10zM1 9h1v1H1zM10 9h1v1H10zM2 10h2v1H2zM8 10h2v1H8zM4 11h4v1H4z" fill="#4a5470"></path><path d="M4 1h4v1H4zM2 2h1v1H2zM4 2h6v1H4zM2 3h8v1H2zM1 4h4v1H1zM7 4h4v1H7z" fill="#e3403a"></path><path d="M3 2h1v1H3zM5 5h2v1H5zM1 6h3v1H1zM5 6h2v1H5zM8 6h3v1H8zM1 7h4v1H1zM7 7h4v1H7zM2 8h8v1H2zM2 9h8v1H2zM4 10h4v1H4z" fill="#ffffff"></path></svg>
</a>
<nav aria-label="Sections" style="align-self: stretch; display: flex; align-items: flex-end; gap: 4px">
<a href="SeriesList.dc.html" class="tab" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 20px; border-radius: 10px 10px 0 0; background: transparent; color: #c3cad8; font-family: 'Jersey 10', sans-serif; font-size: 26px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 0h1v10H1zM2 1h6v1H2zM2 2h7v1H2zM2 3h6v1H2zM2 4h5v1H2z" fill="currentColor"></path></svg>Series</a>
<a href="Pc.dc.html" class="tab" aria-current="page" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 20px; border-radius: 10px 10px 0 0; background: #d93a30; color: #ffffff; font-family: 'Jersey 10', sans-serif; font-size: 26px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 1h10v1H0zM0 2h1v4H0zM9 2h1v4H9zM0 6h10v1H0zM2 3h1v1H2zM4 7h2v1H4zM2 8h6v1H2z" fill="currentColor"></path></svg>PC</a>
<a href="TeamsList.dc.html" class="tab" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 20px; border-radius: 10px 10px 0 0; background: transparent; color: #c3cad8; font-family: 'Jersey 10', sans-serif; font-size: 26px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><path d="M2 1h2v2H2zM6 1h2v2H6zM1 4h4v4H1zM5 4h4v4H5z" fill="currentColor"></path></svg>Teams</a>
</nav>
<div style="flex: 1"></div>
<div style="display: flex; align-items: center; gap: 12px">
<a href="Profile.dc.html" class="me" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 8px; border-radius: 8px; text-decoration: none">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 8px; border: 3px solid #10141d; box-shadow: 0 0 0 2px #ffd34d; background: #ffd34d; box-sizing: border-box; display: grid; place-items: center; font-family: 'Jersey 10', sans-serif; font-size: 24px; color: #10141d">D</span>
<span style="font-family: 'Jersey 10', sans-serif; font-size: 24px; color: #ffffff">Dloez</span>
</a>
<button type="button" class="out" aria-label="Sign out" title="Sign out" style="width: 44px; height: 44px; border: none; border-radius: 8px; background: transparent; color: #a3acbf; display: grid; place-items: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4"></path><path d="M10 8l-4 4 4 4M6 12h10"></path></svg></button>
</div>
</header>

<div style="flex: none; display: flex; align-items: flex-end; gap: 24px; padding: 20px 40px 0">
<div style="display: flex; flex-direction: column; gap: 8px">
<nav aria-label="Breadcrumb" style="display: flex; font-family: 'Jersey 10', sans-serif; font-size: 22px">
<a href="TrainerJourney.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; margin: -10px 0; text-decoration: none"><svg width="8" height="12" viewBox="0 0 14 18" aria-hidden="true"><path d="M12 2L2 9l10 7z" fill="currentColor"></path></svg>Dloez<span aria-hidden="true" style="color: #6b7489">·</span>Series 2</a>
</nav>
<div style="display: flex; align-items: center; gap: 14px">
<span aria-hidden="true" style="width: 50px; height: 50px; flex: none; box-sizing: border-box; border-radius: 10px; border: 3px solid #10141d; box-shadow: 0 0 0 3px #ffd34d; background: #ffd34d; display: grid; place-items: center; font-family: 'Jersey 10', sans-serif; font-size: 30px; color: #10141d">D</span>
<h1 style="margin: 0; font-family: 'Jersey 10', sans-serif; font-weight: 400; font-size: 60px; line-height: 0.85">Dloez's PC</h1>
<span style="font-family: 'Jersey 10', sans-serif; font-size: 18px; color: #10141d; background: #ffd34d; padding: 1px 8px; border-radius: 4px">You</span>
</div>
</div>
<div style="flex: 1"></div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px">
<sc-if value="{{missing}}" hint-placeholder-val="{{ false }}">
<span style="font-weight: 700; font-size: 14px; color: #ffc878">Export missing: no IVs, EVs or stats · no moves</span>
</sc-if>
<div style="display: flex; align-items: center; gap: 12px">
<span id="snap-label" style="font-family: 'Jersey 10', sans-serif; font-size: 22px; color: #a3acbf">Snapshot</span>
<div role="radiogroup" aria-labelledby="snap-label" style="display: flex; gap: 4px; padding: 4px; background: #10141d; border: 3px solid #343f58; border-radius: 12px">
<sc-for list="{{snaps}}" as="s" hint-placeholder-count="6">
<button type="button" class="seg" role="radio" aria-checked="{{s.on}}" disabled="{{s.off}}" onClick="{{s.pick}}" style="min-height: 44px; padding: 0 14px; border: none; border-radius: 8px; background: {{s.bg}}; color: {{s.fg}}; font-family: 'Jersey 10', sans-serif; font-size: 23px; cursor: {{s.cursor}}">{{s.name}}</button>
</sc-for>
</div>
</div>
</div>
</div>
</sc-if>
<div style="flex: 1; min-height: 0; display: flex; gap: 24px; padding: {{bodyPad}}">

<section aria-label="Pokémon" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; background: #222a3b; border: 3px solid #343f58; border-radius: 18px; padding: 14px">

<div style="display: flex; align-items: center; gap: 12px; min-height: 48px">
<span style="font-family: 'Jersey 10', sans-serif; font-size: 30px; line-height: 1; padding-left: 4px">{{count}}</span>
<div style="flex: 1"></div>
<label class="field" style="flex: none; display: flex; align-items: center; gap: 8px; background: #10141d; border: 3px solid #343f58; border-radius: 10px; padding: 0 12px; height: 48px; width: 220px; box-sizing: border-box">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3acbf" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search Pokémon</span>
<input type="search" placeholder="Search" value="{{query}}" onChange="{{onQuery}}" style="flex: 1; min-width: 0; border: none; background: transparent; color: #eef1f7; font-family: 'Nunito', sans-serif; font-size: 16px; outline: none">
</label>
<label class="field" style="flex: none; display: flex; align-items: center; background: #10141d; border: 3px solid #343f58; border-radius: 10px; padding: 0 8px 0 12px; height: 48px; box-sizing: border-box">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Type</span>
<select value="{{type}}" onChange="{{onType}}" style="border: none; background: transparent; color: #eef1f7; font-family: 'Jersey 10', sans-serif; font-size: 22px; outline: none; cursor: pointer; padding-right: 4px">
<option value="">All types</option>
<sc-for list="{{typeOptions}}" as="t" hint-placeholder-count="18"><option value="{{t}}">{{t}}</option></sc-for>
</select>
</label>
<sc-if value="{{chrome}}" hint-placeholder-val="{{ true }}">
<button type="button" class="btn" aria-haspopup="dialog" onClick="{{openBag}}" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 18px 4px; box-sizing: border-box; border: none; border-radius: 8px; background: rgba(255,255,255,0.1); color: #ffffff; box-shadow: inset 0 -4px 0 0 rgba(0,0,0,0.35); font-family: 'Jersey 10', sans-serif; font-size: 24px; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><path d="M3 0h4v1H3zM2 1h1v2H2zM7 1h1v2H7zM1 3h8v1H1zM0 4h10v5H0zM1 9h8v1H1z" fill="#5ad1f0"></path></svg>
Bag
</button>
</sc-if>
</div>

<div style="position: relative; flex: 1; min-height: 0; display: flex; border-radius: 12px; overflow: hidden; background-color: #1d4650; background-image: linear-gradient(45deg, #21505b 25%, transparent 25%, transparent 75%, #21505b 75%), linear-gradient(45deg, #21505b 25%, transparent 25%, transparent 75%, #21505b 75%); background-size: 56px 56px; background-position: 0 0, 28px 28px">
<div class="pcscroll" tabindex="0" aria-label="Pokémon list" onScroll="{{onList}}" onPointerEnter="{{onList}}" style="flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scroll-snap-type: y proximity; scroll-padding: 14px 0; padding: 14px 12px 44px; outline: none">
<div style="display: grid; grid-template-columns: repeat(auto-fill, 106px); grid-auto-rows: 106px; justify-content: center; gap: 6px">
<sc-for list="{{cells}}" as="m" hint-placeholder-count="48">
<button type="button" class="cell" onClick="{{m.pick}}" aria-label="{{m.aria}}" aria-pressed="{{m.on}}" style="position: relative; scroll-snap-align: start; width: 106px; height: 106px; overflow: hidden; border-radius: 12px; border: none; background: {{m.bg}}; box-shadow: {{m.ring}}; cursor: pointer; padding: 0; display: grid; place-items: center">
<img src="{{m.sprite}}" alt="" width="{{px}}" height="{{px}}" style="display: block; image-rendering: pixelated; opacity: {{m.fade}}">
<sc-if value="{{m.inTeam}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 6px; bottom: 6px; height: 22px; padding: 0 6px; border-radius: 6px; background: #d93a30; color: #ffffff; font-family: 'Jersey 10', sans-serif; font-size: 17px; line-height: 22px">Team</span></sc-if>
<span style="position: absolute; left: 8px; top: 2px; font-family: 'Jersey 10', sans-serif; font-size: 20px; color: #eef1f7; text-shadow: 0 2px 0 #10141d">{{m.lvl}}</span>
<sc-if value="{{m.shiny}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true" style="position: absolute; right: 6px; top: 5px"><path d="M3 0h1v2H3zM0 3h2v1H0zM5 3h2v1H5zM3 5h1v2H3zM2 2h3v3H2z" fill="#ffd34d"></path></svg></sc-if>
</button>
</sc-for>
</div>
<sc-if value="{{none}}" hint-placeholder-val="{{ false }}">
<p style="margin: 40px 0; text-align: center; font-family: 'Jersey 10', sans-serif; font-size: 26px; color: #d5dae5">Nothing matches</p>
</sc-if>
</div>
<sc-if value="{{canUp}}" hint-placeholder-val="{{ false }}">
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 64px; pointer-events: none; background: linear-gradient(to bottom, rgba(14,34,40,0.95), rgba(14,34,40,0))"></span>
<button type="button" class="more" aria-label="Scroll up" onClick="{{moreUp}}" style="position: absolute; left: 50%; top: 8px; width: 56px; height: 36px; margin-left: -28px; border-radius: 10px; border: 3px solid #343f58; background: rgba(16,20,29,0.85); display: grid; place-items: center; cursor: pointer"><svg width="20" height="12" viewBox="0 0 10 6" shape-rendering="crispEdges" aria-hidden="true" style="animation: nudge-up 0.5s steps(2) infinite alternate"><path d="M4 0h2v1H4zM3 1h4v1H3zM2 2h6v1H2zM1 3h8v1H1zM0 4h10v1H0z" fill="#5ad1f0"></path></svg></button>
</sc-if>
<sc-if value="{{canDown}}" hint-placeholder-val="{{ true }}">
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; pointer-events: none; background: linear-gradient(to top, rgba(14,34,40,0.95), rgba(14,34,40,0))"></span>
<button type="button" class="more" aria-label="Scroll down" onClick="{{moreDown}}" style="position: absolute; left: 50%; bottom: 8px; width: 56px; height: 36px; margin-left: -28px; border-radius: 10px; border: 3px solid #343f58; background: rgba(16,20,29,0.85); display: grid; place-items: center; cursor: pointer"><svg width="20" height="12" viewBox="0 0 10 6" shape-rendering="crispEdges" aria-hidden="true" style="animation: nudge-down 0.5s steps(2) infinite alternate"><path d="M0 0h10v1H0zM1 1h8v1H1zM2 2h6v1H2zM3 3h4v1H3zM4 4h2v1H4z" fill="#5ad1f0"></path></svg></button>
</sc-if>
</div>
</section>

<aside aria-label="Summary" style="flex: none; width: 380px; display: flex; flex-direction: column; background: #222a3b; border: 3px solid #343f58; border-radius: 18px; overflow: hidden">
<dc-import name="Summary" mon="{{sumMon}}" complete="{{full}}" action="{{sumAction}}" style="flex: 1; min-height: 0; display: flex; flex-direction: column" hint-size="100%,100%"></dc-import>
</aside>

</div>

<sc-if value="{{bagOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(8,11,18,0.72)">
<div role="dialog" aria-modal="true" aria-labelledby="bag-title" style="width: 1040px; height: 780px; display: flex; flex-direction: column; background: #222a3b; border: 3px solid #44506d; border-radius: 18px; box-shadow: 0 12px 0 0 rgba(0,0,0,0.35); overflow: hidden">

<div style="flex: none; display: flex; align-items: center; gap: 16px; padding: 16px 16px 16px 24px; border-bottom: 3px solid #343f58">
<svg width="30" height="30" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><path d="M3 0h4v1H3zM2 1h1v2H2zM7 1h1v2H7z" fill="#8a7330"></path><path d="M1 3h8v1H1zM0 4h10v5H0zM1 9h8v1H1z" fill="#ffb347"></path><path d="M0 5h10v1H0z" fill="#c97a1e"></path><path d="M4 5h2v2H4z" fill="#ffd34d"></path></svg>
<h2 id="bag-title" style="margin: 0; font-family: 'Jersey 10', sans-serif; font-weight: 400; font-size: 44px; line-height: 1">Bag</h2>
<div role="tablist" aria-label="Pockets" style="display: flex; gap: 4px; padding: 4px; margin-left: 12px; background: #10141d; border: 3px solid #343f58; border-radius: 12px">
<sc-for list="{{pockets}}" as="pk" hint-placeholder-count="3">
<button type="button" class="seg" role="tab" aria-selected="{{pk.on}}" onClick="{{pk.pick}}" style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border: none; border-radius: 8px; background: {{pk.bg}}; color: {{pk.fg}}; font-family: 'Jersey 10', sans-serif; font-size: 23px; cursor: pointer">
{{pk.name}}<span style="color: {{pk.countInk}}">{{pk.count}}</span>
</button>
</sc-for>
</div>
<div style="flex: 1"></div>
<label class="field" style="flex: none; display: flex; align-items: center; gap: 8px; background: #10141d; border: 3px solid #343f58; border-radius: 10px; padding: 0 12px; height: 48px; width: 220px; box-sizing: border-box">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3acbf" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search the bag</span>
<input type="search" placeholder="Search" value="{{bagQuery}}" onChange="{{onBagQuery}}" style="flex: 1; min-width: 0; border: none; background: transparent; color: #eef1f7; font-family: 'Nunito', sans-serif; font-size: 16px; outline: none">
</label>
<button type="button" class="x" aria-label="Close" onClick="{{closeBag}}" style="width: 48px; height: 48px; flex: none; border-radius: 10px; border: 3px solid #44506d; background: #2c3549; color: #c3cad8; display: grid; place-items: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 0h2v1h1v1h2V1h1V0h2v2H7v1H6v2h1v1h1v2H6V7H5V6H3v1H2v1H0V6h1V5h1V3H1V2H0z" fill="currentColor"></path></svg></button>
</div>

<div style="flex: 1; min-height: 0; overflow: auto; padding: 14px 16px; background: #1b2232">
<sc-if value="{{showItems}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{bagItems}}" as="it" hint-placeholder-count="24">
<button type="button" class="row" onClick="{{it.pick}}" aria-pressed="{{it.on}}" style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 2px 14px 2px 4px; border-radius: 10px; border: 3px solid {{it.border}}; background: {{it.bg}}; color: #eef1f7; font: inherit; text-align: left; cursor: pointer">
<span style="flex: none; width: 48px; height: 48px; display: grid; place-items: center">
<sc-if value="{{it.mush}}" hint-placeholder-val="{{ false }}"><svg width="36" height="36" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 1h4v1H4zM2 2h8v1H2zM1 3h10v3H1z" fill="#e3403a"></path><path d="M3 3h2v2H3zM8 2h1v2H8zM6 4h1v1H6z" fill="#ffffff"></path><path d="M4 6h4v4H4zM3 10h6v1H3z" fill="#f2ead6"></path></svg></sc-if>
<sc-if value="{{it.sheet}}" hint-placeholder-val="{{ true }}"><span class="ico ico2" style="display: block; width: 48px; height: 48px; background-position: {{it.pos}}"></span></sc-if>
</span>
<span style="flex: 1; min-width: 0; font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.name}}</span>
<span style="flex: none; font-family: 'Jersey 10', sans-serif; font-size: 24px; color: #c3cad8">×{{it.qty}}</span>
</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{showTms}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{bagTms}}" as="tm" hint-placeholder-count="24">
