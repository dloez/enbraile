function sourceLine(t) {

}
class Component extends DCLogic {

      });

        state: t.keys.length + '/' + size, stateInk: t.keys.length === size ? '#7be08a' : '#ffc878',
        browsing: !selecting, selecting, picked: on, pressed: on ? 'true' : 'false', off, dim: off ? 0.45 : 1, cursor: off ? 'default' : 'pointer',
        line: on ? '#5ad1f0' : '#343f58', bg: on ? '#1d3242' : '#222a3b', boxLine: on ? '#5ad1f0' : '#4a5470', boxBg: on ? '#5ad1f0' : '#10141d',
        toggle: () => this.setState({picked: on ? picked.filter((x) => x !== t.name) : picked.concat([t.name])})};
    };
    const n = picked.length;
    const mine = this.props.noTeams ? [] : TEAMS.filter((t) => t.mine).map(row);
    return {
      open, closed: !open, btnBg: open ? '#222a3b' : 'transparent',
      toggle: () => this.setState({open: !open}),
      tabs: TABS.map((t, i) => ({flag: t.name === 'Teams', name: t.name, href: t.href, icon: t.icon, current: i === 2 ? 'page' : null, bg: i === 2 ? '#d93a30' : 'transparent', fg: i === 2 ? '#ffffff' : '#c3cad8'})),
      browsing: !selecting, selecting, pickCount: n + ' picked',
      startPick: () => this.setState({selecting: true, picked: []}), stopPick: () => this.setState({selecting: false, picked: []}),
      cmpOff: n < 2 ? 'true' : null, cmpHref: n < 2 ? null : 'ComparePhone.dc.html', cmpBg: n < 2 ? 'rgba(255,255,255,0.1)' : '#d93a30', cmpInk: n < 2 ? '#6b7489' : '#ffffff',
      groups: [
        {id: 'p-mine', title: 'Yours', empty: mine.length === 0, rows: mine},
        {id: 'p-others', title: 'Other trainers', empty: false, rows: TEAMS.filter((t) => !t.mine).map(row)}
      ]
    };
  }
}
