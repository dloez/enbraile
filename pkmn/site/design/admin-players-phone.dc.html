<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin players, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5ad1f0}a:hover{color:#9be4f7}
.go:not(:disabled):hover{background:#ef5148!important}
.btn:not(:disabled):hover{background:rgba(255,255,255,0.18)!important}
.danger:not(:disabled):hover{background:rgba(255,106,94,0.16)!important}
.field:focus{border-color:#5ad1f0!important;box-shadow:0 0 0 3px rgba(90,209,240,0.3)}
.ph-menu:hover{background:#222a3b!important}
</style>
</helmet>
<div style="width: 390px; min-height: 1300px; box-sizing: border-box; display: flex; flex-direction: column; font-family: 'Nunito', system-ui, sans-serif; font-synthesis: none; font-size: 16px; line-height: 1.45; color: #eef1f7; background-color: #161b26; background-image: radial-gradient(#232b3c 1.5px, transparent 1.5px); background-size: 20px 20px">

<header style="flex: none; height: 60px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; background: #10141d; border-bottom: 4px solid #d93a30; box-sizing: border-box">
<a href="AdminHomePhone.dc.html" aria-label="Home" style="flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 8px">
<svg width="32" height="32" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 0h4v1H4zM2 1h2v1H2zM8 1h2v1H8zM1 2h1v1H1zM10 2h1v1H10zM1 3h1v1H1zM10 3h1v1H10zM0 4h1v1H0zM5 4h2v1H5zM11 4h1v1H11zM0 5h5v1H0zM7 5h5v1H7zM0 6h1v1H0zM4 6h1v1H4zM7 6h1v1H7zM11 6h1v1H11zM0 7h1v1H0zM5 7h2v1H5zM11 7h1v1H11zM1 8h1v1H1zM10 8h1v1H10zM1 9h1v1H1zM10 9h1v1H10zM2 10h2v1H2zM8 10h2v1H8zM4 11h4v1H4z" fill="#4a5470"></path><path d="M4 1h4v1H4zM2 2h1v1H2zM4 2h6v1H4zM2 3h8v1H2zM1 4h4v1H1zM7 4h4v1H7z" fill="#e3403a"></path><path d="M3 2h1v1H3zM5 5h2v1H5zM1 6h3v1H1zM5 6h2v1H5zM8 6h3v1H8zM1 7h4v1H1zM7 7h4v1H7zM2 8h8v1H2zM2 9h8v1H2zM4 10h4v1H4z" fill="#ffffff"></path></svg>
</a>
<span style="flex: 1; display: flex; align-items: center; gap: 8px; font-family: 'Jersey 10', sans-serif; font-size: 26px; color: #ffffff"><svg width="16" height="16" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 2h3v1H1zM0 3h1v3H0zM4 3h1v3H4zM1 6h3v1H1zM5 4h5v1H5zM7 5h1v2H7zM9 5h1v2H9z" fill="#d93a30"></path></svg>Admin</span>
<a href="PhoneHeaderOpen.dc.html" class="ph-menu" aria-label="Menu" style="flex: none; width: 44px; height: 44px; border-radius: 8px; color: #ffffff; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 1h8v2H1zM1 4h8v2H1zM1 7h8v2H1z" fill="currentColor"></path></svg></a>
</header>

<main style="display: flex; flex-direction: column; gap: 16px; padding: 16px 16px 28px">
<h1 style="position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0">Admin players</h1>
<nav aria-label="Admin pages" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; padding: 3px; border-radius: 12px; border: 3px solid #343f58; background: #10141d">
<a href="AdminHomePhone.dc.html" style="display: grid; place-items: center; min-height: 40px; border-radius: 8px; color: #a3acbf; font-family: 'Jersey 10', sans-serif; font-size: 21px; text-decoration: none">Overview</a>
<a href="AdminSeriesList.dc.html" style="display: grid; place-items: center; min-height: 40px; border-radius: 8px; color: #a3acbf; font-family: 'Jersey 10', sans-serif; font-size: 21px; text-decoration: none">Series</a>
<a href="AdminPlayersPhone.dc.html" aria-current="page" style="display: flex; align-items: center; justify-content: center; gap: 5px; min-height: 40px; border-radius: 8px; background: #2c3549; color: #ffffff; font-family: 'Jersey 10', sans-serif; font-size: 21px; text-decoration: none">Players<sc-if value="{{hasWaiting}}" hint-placeholder-val="{{ true }}"><span style="min-width: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #ffd34d; color: #10141d; font-size: 16px; line-height: 18px; text-align: center">{{waitingCount}}</span></sc-if></a>
<a href="AdminGames.dc.html" style="display: grid; place-items: center; min-height: 40px; border-radius: 8px; color: #a3acbf; font-family: 'Jersey 10', sans-serif; font-size: 21px; text-decoration: none">Games</a>
</nav>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<section aria-labelledby="{{g.id}}" style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 3px solid {{g.line}}; border-radius: 16px; background: #222a3b">
<div style="display: flex; align-items: baseline; gap: 10px">
<h2 id="{{g.id}}" style="margin: 0; font-family: 'Jersey 10', sans-serif; font-weight: 400; font-size: 30px; line-height: 1">{{g.title}}</h2>
<span style="font-family: 'Jersey 10', sans-serif; font-size: 22px; color: {{g.countInk}}">{{g.count}}</span>
</div>
<sc-if value="{{g.empty}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; justify-content: center; min-height: 60px; border-radius: 12px; border: 3px dashed #343f58; font-family: 'Jersey 10', sans-serif; font-size: 24px; color: #a3acbf">Nobody</div>
</sc-if>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{g.rows}}" as="p" hint-placeholder-count="3">
<li style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: #1b2232; border: 2px solid #2c3549">
<a href="ProfilePhone.dc.html" style="display: flex; align-items: center; gap: 12px; color: #eef1f7; text-decoration: none">
<span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 8px; border: 3px solid #10141d; box-shadow: 0 0 0 2px {{p.c}}; background: {{p.c}}; box-sizing: border-box; display: grid; place-items: center; font-family: 'Jersey 10', sans-serif; font-size: 24px; color: #10141d">{{p.i}}</span>
<span style="min-width: 0; display: flex; flex-direction: column">
<span style="display: flex; align-items: center; gap: 8px"><span style="font-family: 'Jersey 10', sans-serif; font-size: 25px; line-height: 1">{{p.name}}</span><sc-if value="{{p.invited}}" hint-placeholder-val="{{ false }}"><span style="padding: 0 7px; border-radius: 6px; background: rgba(90,209,240,0.15); font-family: 'Jersey 10', sans-serif; font-size: 16px; color: #9be4f7">Invited</span></sc-if></span>
<span style="font-size: 12px; font-weight: 700; color: #a3acbf">{{p.meta}}</span>
</span>
</a>
<sc-if value="{{p.confirming}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 12px; font-weight: 700; color: #ffb3ab">Deletes their saves and snapshots. Press again to confirm.</span>
</sc-if>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px">
<button type="button" class="danger" onClick="{{p.del}}" style="min-height: 44px; border: 2px solid {{p.delLine}}; border-radius: 8px; background: {{p.delBg}}; color: {{p.delInk}}; font-family: 'Jersey 10', sans-serif; font-size: 21px; cursor: pointer">{{p.delLabel}}</button>
<button type="button" class="{{p.actClass}}" onClick="{{p.act}}" style="min-height: 44px; border: none; border-radius: 8px; background: {{p.actBg}}; color: #ffffff; box-shadow: inset 0 -4px 0 0 rgba(0,0,0,0.3); font-family: 'Jersey 10', sans-serif; font-size: 22px; cursor: pointer">{{p.actLabel}}</button>
</div>
</li>
</sc-for>
</ul>
</section>
</sc-for>

<form onSubmit="{{invite}}" style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 3px solid #343f58; border-radius: 16px; background: #222a3b">
<h2 style="margin: 0; font-family: 'Jersey 10', sans-serif; font-weight: 400; font-size: 30px; line-height: 1">Invite</h2>
<p style="margin: 0; font-size: 13px; color: #c3cad8">Let a friend in before they sign in; their first Discord sign-in lands them straight in.</p>
<label style="display: flex; flex-direction: column; gap: 4px; font-family: 'Jersey 10', sans-serif; font-size: 19px; color: #a3acbf">Discord user ID
<input class="field" inputmode="numeric" placeholder="17 to 20 digits" style="height: 46px; padding: 0 12px; box-sizing: border-box; border-radius: 10px; border: 3px solid #343f58; background: #10141d; color: #eef1f7; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 17px; outline: none">
</label>
<label style="display: flex; flex-direction: column; gap: 4px; font-family: 'Jersey 10', sans-serif; font-size: 19px; color: #a3acbf">Name
<input class="field" maxlength="32" placeholder="Until Discord gives theirs" style="height: 46px; padding: 0 12px; box-sizing: border-box; border-radius: 10px; border: 3px solid #343f58; background: #10141d; color: #eef1f7; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 17px; outline: none">
</label>
<button type="submit" class="go" style="min-height: 50px; border: none; border-radius: 10px; background: #d93a30; color: #ffffff; box-shadow: inset 0 -4px 0 0 rgba(0,0,0,0.3); font-family: 'Jersey 10', sans-serif; font-size: 26px; cursor: pointer">Invite</button>
</form>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
const START = [
  {id: 'k', name: 'Kenji', c: '#8fc8ff', allowed: false, meta: 'Signed in 2 hours ago'},
  {id: 'l', name: 'Lucía', c: '#ff9ec4', allowed: false, meta: 'Signed in yesterday'},
  {id: 'd', name: 'Dloez', c: '#ffd34d', allowed: true, meta: 'Joined 14 Mar 2026'},
  {id: 'm', name: 'MIRAMEEE', c: '#ff9ec4', allowed: true, meta: 'Joined 14 Mar 2026'},
  {id: 'r', name: 'Rubén', c: '#c9a7ff', allowed: true, invited: true, meta: 'Discord ID 412873520117334017'}
];
class Component extends DCLogic {
  st(k, f) { const s = this.state || {}; return s[k] !== undefined ? s[k] : f; }
  renderVals() {
    const list = this.st('list', START);
    const confirm = this.st('confirm', null);
    const row = (p) => {
      const asking = confirm === p.id;
      return {name: p.name, c: p.c, i: p.name[0], meta: p.meta, invited: !!p.invited, confirming: asking,
        delLabel: asking ? 'Confirm delete' : 'Delete', delBg: asking ? '#ff6a5e' : 'transparent', delInk: asking ? '#10141d' : '#ff6a5e', delLine: asking ? '#ff6a5e' : 'rgba(255,106,94,0.45)',
        del: () => (asking || p.invited ? this.setState({list: list.filter((x) => x.id !== p.id), confirm: null}) : this.setState({confirm: p.id})),
        actLabel: p.allowed ? 'Remove' : 'Let in', actBg: p.allowed ? 'rgba(255,255,255,0.1)' : '#d93a30', actClass: p.allowed ? 'btn' : 'go',
        act: () => this.setState({list: list.map((x) => (x.id === p.id ? Object.assign({}, x, {allowed: !x.allowed}) : x)), confirm: null})};
    };
    const waiting = list.filter((p) => !p.allowed).map(row);
    const allowed = list.filter((p) => p.allowed).map(row);
    return {
      waitingCount: waiting.length, hasWaiting: waiting.length > 0,
      groups: [
        {id: 'pw', title: 'Waiting', count: waiting.length, countInk: waiting.length ? '#ffd34d' : '#a3acbf', line: waiting.length ? 'rgba(255,211,77,0.55)' : '#343f58', empty: waiting.length === 0, rows: waiting},
        {id: 'pa', title: 'Allowed', count: allowed.length, countInk: '#a3acbf', line: '#343f58', empty: allowed.length === 0, rows: allowed}
      ],
      invite: (e) => { if (e && e.preventDefault) e.preventDefault(); }
    };
  }
}
</script>
</body>
</html>
