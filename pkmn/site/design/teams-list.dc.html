<h1 style="margin: 0; font-family: 'Jersey 10', sans-serif; font-weight: 400; font-size: 64px; line-height: 0.85">Teams</h1>
<div style="flex: 1"></div>
<sc-if value="{{browsing}}" hint-placeholder-val="{{ true }}">

</div>

<div style="display: flex; align-items: center; min-height: 92px; padding: 0 24px; box-sizing: border-box; border-radius: 14px; border: 3px dashed #343f58; font-family: 'Jersey 10', sans-serif; font-size: 28px; color: #a3acbf">No teams yet</div>

<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">

<button type="button" class="trow" onClick="{{r.click}}" aria-pressed="{{r.pressed}}" disabled="{{r.off}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 20px; min-height: 92px; padding: 0 24px 0 16px; box-sizing: border-box; border-radius: 14px; border: 3px solid {{r.line}}; background: {{r.bg}}; color: #eef1f7; font: inherit; text-align: left; opacity: {{r.dim}}; cursor: {{r.cursor}}">

</span>
</sc-if>
<span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 9px; border: 3px solid #10141d; box-shadow: 0 0 0 2px {{r.c}}; background: {{r.c}}; box-sizing: border-box; display: grid; place-items: center; font-family: 'Jersey 10', sans-serif; font-size: 26px; color: #10141d">{{r.i}}</span>

<span style="font-family: 'Jersey 10', sans-serif; font-size: 34px; line-height: 0.9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
<span style="font-size: 14px; font-weight: 700; color: #a3acbf">{{r.meta}}</span>
</span>
<span style="flex: 1; display: flex; gap: 4px">
<sc-for list="{{r.slots}}" as="s" hint-placeholder-count="6">

</sc-for>
</span>
<span style="flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
<span style="font-family: 'Jersey 10', sans-serif; font-size: 22px; color: {{r.stateInk}}">{{r.state}}</span>
<span style="font-size: 13px; color: #a3acbf">{{r.when}}</span>
</span>
</button>
</div>
</sc-for>
</section>
</sc-for>
</div>

</div>

<sc-if value="{{onCmp}}" hint-placeholder-val="{{ false }}">
<div style="width: 1440px; height: 1000px; display: flex">
<dc-import name="Compare" teams="{{picked}}" on-close="{{closeCmp}}" style="flex: 1; display: flex; flex-direction: column" hint-size="1440px,1000px"></dc-import>
</div>
</sc-if>
<sc-if value="{{onTeam}}" hint-placeholder-val="{{ false }}">
<div style="width: 1440px; height: 1000px">
<dc-import name="Team" preset="{{open}}" added="{{noAdd}}" hint-size="1440px,1000px"></dc-import>
</div>
</sc-if>
</x-dc>
