<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team page: locked, admin</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 1000px">
<dc-import name="Team" preset="locked" admin="{{admin}}" added="{{noAdd}}" hint-size="1440px,1000px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {noAdd: -1, admin: true};
  }
}
</script>
</body>
</html>
