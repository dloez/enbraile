<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Teams on a phone: filters open</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#161b26}
</style>
</helmet>
<div style="width: 390px; min-height: 1500px">
<dc-import name="TeamsListPhone" filters-open="{{open}}" kind="round" hint-size="390px,1500px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    return {open: true};
  }
}
</script>
</body>
</html>
