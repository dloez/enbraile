[project]
name = "anil"
version = "0.1.0"
description = "Installs, runs and drives Pokémon Añil with the group's Randomlocke mod"
authors = [
    { name = "David Lopez Saez", email = "40007435+dloez@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rubymarshal>=1.2.10",
]

[project.scripts]
anil = "anil.cli:anil"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anil"]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["generate_export_data.py"]

[tool.ty.src]
exclude = ["generate_export_data.py"]
