name: dj bot image

on:
  push:
    branches: [main]
    paths:
      - dj/bot/**
      - .github/workflows/dj-bot.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dj-bot-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: dj/bot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dj/bot/package-lock.json
      - run: npm ci
      - run: npm run gate
      - id: tag
        run: echo "tag=main-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: dj/bot
          platforms: linux/arm64
          push: true
          tags: ghcr.io/dloez/enbraile-dj-bot:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/dloez/enbraile
