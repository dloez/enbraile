<style>
body{margin:0;background:#15140f}
.r{--bg:#15140f;--surf:#1e1d16;--surf-2:#29281f;--line:#36342a;--line-2:#4b483b;--text:#ede8dc;--mute:#aca593;--red:#c23a20;--red-hi:#d4492e;--red-tx:#f27c60;--blue:#3a57c9;--blue-hi:#4865d6;--blue-tx:#9db0ff;--blue-bg:#20263f;--slip:#ebdfb0;--slip-ink:#1b1a14;--slip-mute:#5b5443;--slip-line:#c9bb88;
font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;font-size:17px;line-height:1.5;color:var(--text);background:var(--bg);box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.r *{box-sizing:border-box}
.r h1,.r h2,.r h3,.r p,.r ul{margin:0;padding:0}
.r ul{list-style:none}
.cond{font-family:'Archivo',sans-serif;font-stretch:68%;font-weight:800;text-transform:uppercase;line-height:.92;letter-spacing:.01em}
.lab{font-size:15px;font-weight:700;color:var(--mute);line-height:1.3}
.hd{flex:none;height:64px;background:var(--surf);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 24px}
.wm{display:flex;align-items:center;gap:10px;min-height:44px;color:var(--text);text-decoration:none}
.wm i{width:10px;height:10px;background:var(--red-tx);display:block}
.wm b{font-family:'Archivo',sans-serif;font-stretch:68%;font-weight:900;font-size:26px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.sp{flex:1}
.yr{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 16px 0 14px;border-radius:22px;background:var(--surf-2);color:var(--text);text-decoration:none;font-size:16px;font-weight:700;box-shadow:inset 0 0 0 1px var(--line-2)}
.yr:hover{box-shadow:inset 0 0 0 1.5px var(--text)}
.yr .live{width:10px;height:10px;border-radius:50%;background:var(--red-tx);flex:none}
.yr .m{color:var(--mute);font-weight:400}
.lg{display:flex;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line-2);overflow:hidden}
.lg button{min-width:52px;height:44px;border:0;background:transparent;color:var(--mute);font:700 15px 'Atkinson Hyperlegible Next',system-ui,sans-serif;cursor:pointer}
.lg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.lg button:hover{color:var(--text)}
.lg button[aria-pressed="true"]:hover{color:var(--bg)}
.cs{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--surf-2);box-shadow:inset 0 0 0 1px var(--line-2);font-size:13px;font-weight:700;color:var(--text);flex:none;line-height:1}
.cs-me{background:var(--text);color:var(--bg);box-shadow:none}
.b{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 24px;border:0;border-radius:8px;background:var(--text);color:var(--bg);font:700 18px 'Atkinson Hyperlegible Next',system-ui,sans-serif;text-decoration:none;cursor:pointer;white-space:nowrap}
.b:hover,.b:focus-visible{background:#fff}
.b-red{background:var(--red);color:#fff}
.b-red:hover,.b-red:focus-visible{background:var(--red-hi);color:#fff}
.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--mute);text-decoration:none;font-size:16px;font-weight:700}
.back:hover{color:var(--text)}
.plan{background:var(--surf);border:1px solid var(--line);border-radius:12px;color:#d6cfbf;line-height:0;padding:32px}
.sec{display:flex;flex-direction:column;gap:16px}
.sec h2{font-size:22px;font-weight:700;line-height:1.3}
.empty{font-size:17px;color:var(--mute);padding:20px;border-radius:12px;border:1px dashed var(--line-2)}
.start{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:24px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;border:0;margin:0;padding:0;min-width:0}
.seg legend{font-size:15px;font-weight:700;color:var(--mute);padding:0;margin-bottom:8px}
.seg label{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line-2);font-size:17px;font-weight:700;cursor:pointer}
.seg label:hover{box-shadow:inset 0 0 0 1.5px var(--text)}
.seg input{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--mute);margin:0;flex:none}
.seg input:checked{border:6px solid var(--text)}
.seg label:has(input:checked){box-shadow:inset 0 0 0 2px var(--text);background:var(--surf-2)}
.note{font-size:16px;color:var(--mute);line-height:1.45}
.note b{color:var(--text)}
a{color:var(--text)}a:hover{color:#fff}
</style>
</helmet>

<main style="flex:1;min-height:0;padding:32px 0 0">
<div style="max-width:1184px;margin:0 auto;display:grid;grid-template-columns:600px 520px;gap:64px;align-items:start">
<div style="display:flex;flex-direction:column;gap:24px">
<a class="back" href="Maps.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Maps</a>
<div><span class="lab">Sample</span><h1 class="cond" style="font-size:88px;margin-top:8px">Kessel Works</h1></div>

</div>

</section>
<section class="sec"><h2>Start a run</h2>

<a class="b b-red" href="Run.dc.html" style="width:100%">Start a run</a>
</div>
<p class="note">Starting a run takes you out of yours on <b>Harrow Station</b>.</p>
</section>
</div>
</div>
</main>
