<body>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Courier+Prime:ital,wght@0,400;0,700;1,400&amp;display=swap">
<style>
body{margin:0}
.r{--paper:#e9e4d7;--sheet:#f4f0e6;--slip:#efe3ad;--ink:#15140f;--ink-2:#2e2b23;--mute:#5d584d;--rule:#c9c1ae;--red:#c4321a;--red-hi:#d94427;--blue:#2945a8;--on-ink:#ece7da;--on-ink-mute:#a8a293;--ink-rule:#3b382f;
font-family:'Archivo',system-ui,sans-serif;font-stretch:100%;font-synthesis:none;color:var(--ink);background:var(--paper);box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column}
.r *{box-sizing:border-box}
.r h1,.r h2,.r h3,.r p{margin:0}
.cond{font-stretch:62%;font-weight:800;text-transform:uppercase;line-height:.86;letter-spacing:0}
.ty{font-family:'Courier Prime',ui-monospace,monospace}
.lab{font-family:'Courier Prime',ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.hd{flex:none;height:48px;background:var(--ink);color:var(--on-ink);display:flex;align-items:stretch;position:relative;z-index:3}
.hd>*{display:flex;align-items:center;padding:0 18px;border-right:1px solid var(--ink-rule)}
.hd>.sp{flex:1}
.hd>.lg{padding:0}
.hd>*:last-child{border-right:0}
.wm{gap:10px;text-decoration:none;color:var(--on-ink)}
.wm i{width:9px;height:9px;background:var(--red);display:block}
.wm b{font-stretch:62%;font-weight:900;font-size:26px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.hd .tag{font-family:'Courier Prime',monospace;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--on-ink-mute)}
.lg button{height:48px;min-width:52px;background:transparent;border:0;color:var(--on-ink-mute);font:700 13px 'Courier Prime',monospace;letter-spacing:.09em;cursor:pointer}
.lg button[aria-pressed="true"]{background:var(--on-ink);color:var(--ink)}
.lg button:hover{color:var(--on-ink)}
.lg button[aria-pressed="true"]:hover{color:var(--ink)}
.me span{display:inline-flex;align-items:center;height:26px;padding:0 8px;background:var(--on-ink);color:var(--ink);font:700 12px 'Courier Prime',monospace;letter-spacing:.09em}
.bk{color:var(--on-ink);text-decoration:none;width:48px;justify-content:center}
.hd .ttl{font-stretch:62%;font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.cs{display:inline-flex;align-items:center;justify-content:center;height:22px;min-width:30px;padding:0 5px;border:1px solid currentColor;font:700 11px 'Courier Prime',monospace;letter-spacing:.06em;line-height:1}
.cs-me{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cs-cari{background:var(--red);color:#fff;border-color:var(--red)}
.tags{display:flex;gap:3px}
.b{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:44px;padding:0 18px;border:0;background:var(--ink);color:var(--on-ink);font:700 13px 'Archivo',sans-serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;cursor:pointer;white-space:nowrap}
.b:hover,.b:focus-visible{background:var(--ink-2)}
.b-red{background:var(--red);color:#fff}
.b-red:hover,.b-red:focus-visible{background:var(--red-hi)}
.b-line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.b-line:hover,.b-line:focus-visible{background:var(--ink);color:var(--on-ink)}
.b-blue{background:var(--blue);color:#fff}
.b-blue:hover,.b-blue:focus-visible{background:#1f378c}
.b-paper{background:var(--on-ink);color:var(--ink)}
.b-paper:hover,.b-paper:focus-visible{background:#fff}
.mr{display:grid;grid-template-columns:140px minmax(0,1fr) 400px;gap:32px;padding:22px 0;border-bottom:1px solid var(--ink);align-items:start}
.mr:last-of-type{border-bottom:3px solid var(--ink)}
.mn{font-size:66px;margin-top:6px}
.pl{border:1px solid var(--ink);background:var(--sheet);line-height:0}
.rl{display:grid;grid-template-columns:104px minmax(0,1fr) 38px 112px;align-items:center;gap:10px;min-height:52px;border-top:1px solid var(--rule)}
.rl:first-child{border-top:0}
.rl .nm{font-size:16px;font-weight:600}
.rl .b{min-height:44px;padding:0 14px}
.here{font:700 12px 'Courier Prime',monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--red);text-align:right}
.none{font:italic 400 15px 'Courier Prime',monospace;color:var(--mute);min-height:52px;display:flex;align-items:center}
.act{display:flex;justify-content:flex-end;padding-top:10px}
.colh{display:grid;grid-template-columns:140px minmax(0,1fr) 400px;gap:32px;height:40px;align-items:center;border-bottom:1px solid var(--ink)}
.yr{border-top:3px solid var(--ink);padding-top:14px;display:flex;flex-direction:column;gap:14px}
.yr h2{font-size:52px}
.yr-m{display:flex;gap:3px;align-items:center}
.sheet{background:var(--sheet);border:1px solid var(--ink);line-height:0}
.rail{width:320px;flex:none;background:var(--ink);color:var(--on-ink);display:flex;flex-direction:column;padding:28px 28px 0}
.rail .lab{color:var(--on-ink-mute)}
.rail h2{font-size:76px;margin-top:12px}
.mem{list-style:none;margin:22px 0 0;padding:0}
.mem li{display:grid;grid-template-columns:44px 1fr auto;align-items:center;min-height:42px;border-top:1px solid var(--ink-rule);font-size:15px;font-weight:600}
.mem li:last-child{border-bottom:1px solid var(--ink-rule)}
.mem .v{font:700 11px 'Courier Prime',monospace;letter-spacing:.1em;color:var(--on-ink-mute)}
.rail .cs-me{background:var(--on-ink);color:var(--ink);border-color:var(--on-ink)}
.voice{margin:auto -28px 0;padding:22px 28px 28px;border-top:1px solid var(--ink-rule);display:flex;flex-direction:column;gap:12px}
.voice .big{font-stretch:62%;font-weight:800;font-size:34px;text-transform:uppercase;line-height:.9}
.voice.on{background:var(--red);color:#fff;border-top-color:var(--red)}
.voice.on .lab{color:#fff}
.meter{display:flex;gap:3px;align-items:flex-end;height:30px}
.meter i{display:block;width:5px;height:100%;background:currentColor;transform-origin:bottom;animation:lv 1.2s ease-in-out infinite}
.meter i:nth-child(2n){animation-delay:-.3s}.meter i:nth-child(3n){animation-delay:-.7s}.meter i:nth-child(5n){animation-delay:-.5s}
@keyframes lv{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.trh{flex:none;height:44px;display:grid;grid-template-columns:100px 128px 1fr auto;align-items:center;border-bottom:1px solid var(--ink);margin:0 48px}
.rows{flex:1;min-height:0;overflow:hidden;margin:0 48px;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:12px}
.row{display:grid;grid-template-columns:100px 128px minmax(0,700px);padding:12px 0;border-top:1px solid var(--rule)}
.row:first-child{border-top:0}
.row .t{font:400 13px 'Courier Prime',monospace;color:var(--mute);padding-top:3px}
.who{font-stretch:62%;font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.who-cari{color:var(--red);display:flex;align-items:center;gap:7px}
.who-cari::before{content:"";width:8px;height:8px;background:var(--red);display:block}
.who-rev{color:var(--blue)}
.txt{font-size:16px;line-height:1.45}
.old .txt,.old .who,.old .t{color:var(--mute)}
.old .who-cari::before{background:var(--mute)}
.slip{margin-top:12px;background:var(--slip);border:1px solid var(--ink);max-width:640px}
.slip-h{display:flex;align-items:center;justify-content:space-between;height:32px;padding:0 14px;border-bottom:1px solid var(--ink);font:700 11px 'Courier Prime',monospace;letter-spacing:.12em;text-transform:uppercase}
.slip-h b{font-family:'Archivo',sans-serif;font-stretch:62%;font-weight:900;font-size:16px;letter-spacing:.12em}
.rung{padding:14px 16px;font:400 17px/1.5 'Courier Prime',monospace}
.rung+.rung{border-top:1px dashed var(--mute)}
.rung-old{color:var(--mute);font-size:15px;padding-top:10px;padding-bottom:10px}
.slip-f{display:flex;align-items:stretch;border-top:1px solid var(--ink)}
.slip-f .b{min-height:46px}
.fb{display:flex;margin:0 0 0 auto;padding:0;border:0}
.fb label{display:flex;align-items:center;gap:8px;padding:0 14px;min-height:46px;font:700 12px 'Courier Prime',monospace;letter-spacing:.06em;text-transform:uppercase;border-left:1px solid var(--ink);cursor:pointer}
.fb input{appearance:none;-webkit-appearance:none;width:14px;height:14px;border:1.5px solid var(--ink);margin:0;background:transparent;flex:none}
.fb input:checked{background:var(--ink);box-shadow:inset 0 0 0 2px var(--slip)}
.fb label:hover{background:rgba(21,20,15,.07)}
.sheet-wrap{border-top:1px solid var(--ink);padding:12px;background:var(--slip)}
.cmp{flex:none;display:grid;grid-template-columns:100px 1fr auto auto;align-items:center;gap:10px;border-top:2px solid var(--ink);margin:0 48px;height:72px}
.cmp .tx{font:700 13px 'Courier Prime',monospace;letter-spacing:.1em;color:var(--mute)}
.cmp input{border:0;background:transparent;font:400 17px 'Courier Prime',monospace;color:var(--ink);outline:none;height:44px;padding:0;min-width:0}
.cmp input::placeholder{color:var(--mute)}
.revb{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;background:transparent;border:0;box-shadow:inset 0 0 0 1.5px var(--rule);color:var(--ink);font:700 12px 'Courier Prime',monospace;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.revb i{width:12px;height:12px;border:1.5px solid currentColor;display:block}
.revb:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.revb[aria-pressed="true"]{background:var(--blue);color:#fff;box-shadow:none}
.revb[aria-pressed="true"] i{background:#fff;border-color:#fff}
.cmp-rev{border-top:2px dashed var(--blue)}
.cmp-rev .tx{color:var(--blue)}
.cmp-rev input::placeholder{color:var(--blue)}
.caret{display:inline-block;width:10px;height:18px;background:var(--red);vertical-align:-3px;margin-left:6px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.ring{transform-box:fill-box;transform-origin:center;animation:rg 2.4s ease-out infinite}
@keyframes rg{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.meter i,.caret,.ring{animation:none}}
.dl{display:grid;grid-template-columns:130px 1fr;border-top:1px solid var(--ink)}
.dl dt,.dl dd{margin:0;padding:14px 0;border-bottom:1px solid var(--rule);min-height:52px;display:flex;align-items:center}
.dl dd{font-size:17px;font-weight:600;gap:10px;flex-wrap:wrap}
.note{border:1px solid var(--ink);display:grid;grid-template-columns:auto 1fr;align-items:stretch}
.note .k{background:var(--ink);color:var(--on-ink);font:700 11px 'Courier Prime',monospace;letter-spacing:.12em;text-transform:uppercase;padding:12px 10px;display:flex;align-items:center}
.note p{padding:12px 14px;font-size:15px;line-height:1.4}
.opt{display:grid;grid-template-columns:28px 52px 1fr;align-items:center;min-height:64px;padding:0 18px;border:1.5px solid var(--ink);cursor:pointer;font-size:20px;font-weight:600}
.opt+.opt{margin-top:-1.5px}
.opt input{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1.5px solid currentColor;margin:0;background:transparent}
.opt input:checked{background:currentColor;box-shadow:inset 0 0 0 3px var(--ink)}
.opt:has(input:checked){background:var(--ink);color:var(--on-ink)}
.opt .code{font:700 13px 'Courier Prime',monospace;letter-spacing:.1em}
.scrim{position:absolute;inset:48px 0 0 0;background:rgba(233,228,215,.8);z-index:1}
.x{width:44px;height:44px;display:grid;place-items:center;background:transparent;border:0;color:var(--ink);cursor:pointer}
.x:hover{background:rgba(21,20,15,.08)}
a{color:var(--ink)}a:hover{color:var(--red)}
</style>
</helmet>
