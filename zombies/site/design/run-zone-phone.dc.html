.z{--ground:#0b0e0d;--fog:#123029;--ink:#070908;--panel:#121816;--panel-hi:#18201e;--well:#090c0b;--line:#24302c;--line-hi:#37483f;--bone:#ebe5d6;--ash:#a3aba4;--dim:#6c7871;--blood:#c3302a;--blood-hi:#de4339;--blood-deep:#5a1512;--mint:#7fe3c4;--mint-ink:#062019;--mint-hi:#a6f0d9;--amber:#f0b23c;--amber-dim:#5c4416;--paper:#e6dcc0;--paper-ink:#211c12;--note:#d8c48d;

.hdr{flex:none;height:64px;background:var(--ink);border-bottom:3px solid var(--blood);display:flex;align-items:center;gap:16px;padding:0 32px;position:relative;z-index:2}

.mark{display:flex;align-items:baseline;gap:6px;color:var(--bone);text-decoration:none}

.btn-go{background:var(--blood);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,0.35)}
.btn-go:hover,.btn-go:focus-visible{background:var(--blood-hi)}
.btn-mint{background:var(--mint);color:var(--mint-ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,0.25)}

.hint{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:4px 14px 14px 14px;padding:18px 20px 14px;box-shadow:0 6px 0 rgba(0,0,0,0.45);

.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:4px;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.wave i{display:block;height:10px;width:3px;margin-right:3px;border-radius:2px;background:var(--amber);animation:wave 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}.wave i:nth-child(5){animation-delay:.6s}
@keyframes wave{0%,100%{height:5px}50%{height:16px}}
.zone-ring{transform-origin:center;transform-box:fill-box;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.typing span,.wave i,.zone-ring{animation:none}}
.composer{display:flex;align-items:flex-end;gap:10px;background:var(--well);border:2px solid var(--line);border-radius:14px;padding:8px 8px 8px 16px}
.composer-rev{border:2px dashed var(--note);background:rgba(216,196,141,0.05)}
.field{flex:1;min-height:40px;display:flex;align-items:center;font-size:16px;color:var(--dim)}
.ibtn{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;color:var(--ash);background:transparent;border:0}

.scrim{position:absolute;inset:0;background:rgba(3,5,4,0.72);backdrop-filter:blur(2px);z-index:5}
